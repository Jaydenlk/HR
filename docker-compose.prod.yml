# ──────────────────────────────────────────────────────────────────────────────
# Coach 生产编排(postgres16 + api + web + caddy)
# 用法:docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# 资源配额按 2C2G 独占机保守设定(实际可用约 1.6G,留 ~300M 给宿主):
#   postgres ~384M / api ~512M / web ~256M / caddy ~128M,合计 ≈1.28G。
# 若迁到 4C4G 机器,可按比例上调 limits 与 PG 缓冲参数。
# 入口端口经 HTTP_PORT/HTTPS_PORT 可配(默认 80/443)。
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?需在 .env.production 配置 DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS:?需在 .env.production 配置 DB_PASS}
      POSTGRES_DB: ${DB_NAME:?需在 .env.production 配置 DB_NAME}
      # 初始化编码,避免中文存取乱码。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # shared_buffers=128MB:2C2G 单机给 PG 约 384M 内存,128MB 共享缓冲为保守合理值。
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "effective_cache_size=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    networks:
      - coach

  # ── API(NestJS) ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: coach-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      APP_VERSION: ${APP_VERSION:-unknown}
      # 强制 postgres(忽略 .env 里可能残留的 DB_TYPE=sqlite)。
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    # 其余密钥/SMTP/CORS 等从 .env.production 透传(避免在此重复罗列、泄露)。
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    networks:
      - coach

  # ── Web(Next.js standalone) ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # 生产前端走同源 /api(由 caddy 反代到 api),故构建期内联 /api 即可。
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_DEV_LOGIN: "0"
    image: coach-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    # standalone server 监听容器内 3000(见 Dockerfile.web);node 运行时自带,用 fetch 探活。
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - coach

  # ── Caddy 反代(自动 HTTPS) ────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3 走 QUIC(UDP 443);不映射则浏览器静默回退 HTTP/2,故显式开放。
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Caddyfile 站点地址直接用 {$DOMAIN}。未配域名时这里兜底注入 ":80"(纯 HTTP);
      # 不能注入空串——Caddy 会把空站点名的块误判为全局配置块而启动失败。
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - coach

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  coach:
    driver: bridge
