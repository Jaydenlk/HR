packages:
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  better-sqlite3: true
  # ip2region-ts 唯一脚本是 preinstall:only-allow pnpm(包管器约束,非构建),无需执行。
  ip2region-ts: false
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@nestjs/platform-express'
  - better-sqlite3
  - msw
  - sharp
  - unrs-resolver
