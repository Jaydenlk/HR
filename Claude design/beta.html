  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#eee9dc;font-family:"Plus Jakarta Sans","PingFang SC","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;overflow:hidden}
    .intro{
      position:fixed;top:14px;left:14px;z-index:10;
      background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(180%);
      border:1px solid rgba(0,0,0,.06);border-radius:14px;
      padding:14px 18px;font-size:12.5px;color:#1d1d1f;
      max-width:380px;line-height:1.5;font-weight:500;
      box-shadow:0 8px 24px -10px rgba(0,0,0,.1);
    }
    .intro b{font-weight:700}
    .intro .title{font-size:18px;line-height:1.1;margin-bottom:6px;font-weight:800;letter-spacing:-.02em}
    .intro .title .pill{display:inline-block;margin-left:6px;background:#c87317;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
    .intro .tip{font-size:11px;color:#6e6e73;margin-top:8px;border-top:1px solid #e5e5e7;padding-top:8px;font-weight:500}
    .intro .tip kbd{font-family:"JetBrains Mono",monospace;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid #d2d2d7;background:#f5f5f7;color:#424245;margin:0 2px;font-weight:600}
    .intro a{color:#0a84ff;font-weight:600;text-decoration:none}
  </style>

  <!-- Cream override: must come AFTER component <style> tags by source order. Uses !important to ensure win. -->
  <link rel="stylesheet" href="beta-theme.css" />
</head>
