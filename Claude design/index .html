<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Coach · 求职助手</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fbfbfd;font-family:"Plus Jakarta Sans","PingFang SC","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;overflow:hidden;height:100%}
    body{display:flex;flex-direction:column}

    /* route bar — top nav between screens */
    .route-bar{
      flex-shrink:0;height:48px;
      display:flex;align-items:center;gap:24px;
      padding:0 24px;
      background:rgba(255,255,255,.85);
      backdrop-filter:blur(20px) saturate(180%);
      border-bottom:1px solid rgba(0,0,0,.06);
      font-size:13px;
    }
    .rb-logo{display:flex;align-items:center;gap:8px;font-weight:700;color:#1d1d1f;letter-spacing:-.01em}
    .rb-logo .mark{width:24px;height:24px;border-radius:7px;background:#0a84ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .rb-version{font-family:"JetBrains Mono",monospace;font-size:10px;color:#6e6e73;background:#f5f5f7;padding:2px 7px;border-radius:5px;font-weight:600;letter-spacing:.02em;margin-left:6px}
    .rb-tabs{display:flex;gap:2px;background:#f5f5f7;border-radius:999px;padding:3px}
    .rb-tab{
      appearance:none;border:0;background:transparent;
      color:#6e6e73;padding:6px 14px;font-size:12.5px;font-weight:600;
      border-radius:999px;letter-spacing:-.003em;cursor:pointer;
      font-family:inherit;
    }
    .rb-tab:hover{color:#1d1d1f}
    .rb-tab.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .rb-tab.rb-tool{font-size:12px;color:#86868b}
    .rb-tab.rb-tool.active{color:#1d1d1f}
    .rb-sep{color:#d2d2d7;font-weight:500;font-size:13px;padding:0 4px}
    .rb-meta{margin-left:auto;font-size:11px;color:#a1a1a6;font-weight:500}

    /* host for screens */
    .route-host{flex:1;position:relative;min-height:0;overflow:hidden}
    #root{height:100%;display:flex;flex-direction:column}
  </style>

  <link rel="stylesheet" href="light-theme.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="core.jsx"></script>
  <script type="text/babel" src="s-landing.jsx"></script>
  <script type="text/babel" src="s-today.jsx"></script>
  <script type="text/babel" src="s-monthly.jsx"></script>
  <script type="text/babel" src="s-interview.jsx"></script>
  <script type="text/babel" src="s-overview.jsx"></script>
  <script type="text/babel" src="s-chat.jsx"></script>
  <script type="text/babel" src="s-tools.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
