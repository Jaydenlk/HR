<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coach · 求职助手</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#f0ece4;font-family:"Geist","Noto Sans SC",sans-serif;overflow:hidden}

    .canvas-intro{
      position:fixed;top:14px;left:14px;z-index:10;
      background:rgba(255,255,255,.88);backdrop-filter:blur(14px) saturate(160%);
      border:1px solid #e0d9cb;border-radius:12px;
      padding:14px 18px;font-size:12px;color:#2c2a26;
      max-width:380px;line-height:1.5;
      box-shadow:0 8px 24px -10px rgba(0,0,0,.08);
    }
    .canvas-intro b{font-weight:600}
    .canvas-intro .title{font-family:"Instrument Serif","Noto Serif SC",serif;font-size:20px;line-height:1.1;margin-bottom:6px;font-style:italic;color:#191917}
    .canvas-intro .tip{font-size:11px;color:#7a7468;margin-top:8px;border-top:1px dashed #e0d9cb;padding-top:8px}
    .canvas-intro .tip kbd{font-family:"Geist Mono",monospace;font-size:10px;padding:1px 4px;border-radius:3px;border:1px solid #d8d2c2;background:#fafaf7;color:#3a3933;margin:0 2px}
  </style>
</head>
<body>
  <div class="canvas-intro">
    <div class="title">Coach · 求职助手</div>
    <div>一个 App，5 个层级：<b>对话入口</b>、<b>今天</b>、<b>月刊（面经为主）</b>、<b>面试复盘</b>、<b>求职总览</b>。视觉=极简 D，A/B/C 作为内部层级。</div>
    <div class="tip">空白处拖动平移 · 滚轮缩放 · 点击 ↗ 进入单屏全屏 · <kbd>←/→</kbd> 切换 · <kbd>Esc</kbd> 退出</div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="coach-base.jsx"></script>
  <script type="text/babel" src="coach-data.jsx"></script>
  <script type="text/babel" src="coach-landing.jsx"></script>
  <script type="text/babel" src="coach-today.jsx"></script>
  <script type="text/babel" src="coach-monthly.jsx"></script>
  <script type="text/babel" src="coach-interview.jsx"></script>
  <script type="text/babel" src="coach-overview.jsx"></script>
  <script type="text/babel" src="coach-chat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
