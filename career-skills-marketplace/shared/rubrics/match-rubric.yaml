# 匹配评估量纲 (Match Rubric)
# Career Skills Marketplace — match-evaluator skill 使用
# 版本: 1.0.0

rubric_version: "1.0.0"
description: "简历与 JD 匹配度多维评估标准，5个维度加权评分"
total_weight: 100

# ============================================================
# 评分维度（共 5 个，总权重 100%）
# ============================================================
dimensions:

  skill_match:
    label: "技能匹配"
    weight: 30
    description: "候选人技术/专业技能与 JD 要求的重叠程度"
    scoring:
      5:
        label: "完全匹配"
        criteria:
          - "覆盖 JD 全部必须技能（required skills 100%）"
          - "覆盖 JD 加分技能 >= 60%"
          - "技能熟练度描述与 JD 要求层级相符（JD 要精通则有大量实践证明）"
      4:
        label: "强匹配"
        criteria:
          - "覆盖 JD 必须技能 >= 80%"
          - "缺失技能为非核心或可快速学习项"
      3:
        label: "中等匹配"
        criteria:
          - "覆盖 JD 必须技能 50-80%"
          - "有 1-2 项核心技能缺失但有相关技能可迁移"
      2:
        label: "弱匹配"
        criteria:
          - "覆盖 JD 必须技能 25-50%"
          - "存在多项核心技能缺失"
      1:
        label: "无匹配"
        criteria:
          - "覆盖 JD 必须技能 < 25%"
          - "技能方向与 JD 完全不同"
    china_specific:
      - "中文 JD '熟悉' = 了解+实践过；'精通' = 项目中深度使用"
      - "技术栈相似度（如 Vue vs React）可作为部分匹配，但需注明差异"
      - "软技能（'沟通能力'/'执行力'）不计入技能匹配，归入角色匹配"

  experience_match:
    label: "经验匹配"
    weight: 25
    description: "工作年限、行业经验、项目规模与 JD 要求的匹配程度"
    scoring:
      5:
        label: "完全匹配"
        criteria:
          - "工作年限满足 JD 要求（如要求3年，有3年以上）"
          - "行业经验与 JD 目标行业一致"
          - "项目规模与岗位级别匹配（高级岗有大规模项目经历）"
          - "有在类似业务场景（B2B/B2C/工具/游戏）的经历"
      4:
        label: "强匹配"
        criteria:
          - "工作年限满足要求，行业经验有 1 项偏差"
          - "跨行业但核心业务逻辑相通（如电商→新零售）"
      3:
        label: "中等匹配"
        criteria:
          - "工作年限满足要求，但行业跨度较大"
          - "或经验不足 20% 但成长曲线明显"
      2:
        label: "弱匹配"
        criteria:
          - "工作年限不足 JD 要求 50%"
          - "行业经验与 JD 无重叠"
      1:
        label: "无匹配"
        criteria:
          - "经验年限严重不足（如要5年有1年）"
          - "从未接触相关行业或业务类型"
    china_specific:
      - "应届生即使年限为0，可通过实习经历和项目弥补"
      - "跨行业候选人需要在简历中主动建立'经验迁移'叙事"
      - "外企经验在国内招聘中普遍受认可，但国内大厂 > 外企的认知在部分岗位存在"

  education_match:
    label: "教育匹配"
    weight: 15
    description: "学历层次、毕业院校声誉与 JD 教育要求的匹配程度"
    scoring:
      5:
        label: "完全匹配"
        criteria:
          - "学历层次满足或超过 JD 要求"
          - "专业与岗位高度相关（计算机→技术岗，金融→金融岗）"
          - "毕业院校在目标岗位认可范围内"
      4:
        label: "强匹配"
        criteria:
          - "学历满足要求，专业相关度高"
          - "或学历略超要求（硕士投本科要求岗位）"
      3:
        label: "中等匹配"
        criteria:
          - "学历满足要求，但专业跨度较大（文科投技术岗）"
          - "或知名院校但专业不完全匹配"
      2:
        label: "弱匹配"
        criteria:
          - "学历低于 JD 要求一个层次（本科投硕士要求岗位）"
          - "专业与岗位无直接关系"
      1:
        label: "无匹配"
        criteria:
          - "学历低于 JD 要求两个层次以上"
    china_specific:
      - "985/211 标签在大厂校招中明显影响筛选，需在 education_match 中注明"
      - "学历要求'本科及以上'在大厂通常默认 985/211 竞争力更强"
      - "海外学历认可度因公司和岗位差异大，需具体说明"
      - "专升本或成人教育学历在大厂招聘中通常不被认可"

  role_match:
    label: "角色匹配"
    weight: 15
    description: "候选人的工作方式、软技能和职业发展阶段与岗位定位的匹配程度"
    scoring:
      5:
        label: "完全匹配"
        criteria:
          - "职业发展阶段与岗位级别吻合（IC vs 管理岗）"
          - "工作风格与团队文化描述匹配（独立/协作/跨部门）"
          - "软技能与岗位核心要求匹配（'用户洞察'→产品岗）"
          - "领导力证明与管理要求匹配（有带团队经历）"
      4:
        label: "强匹配"
        criteria:
          - "职业阶段基本吻合，有 1 项次要角色维度偏差"
      3:
        label: "中等匹配"
        criteria:
          - "从 IC 转管理或反向，有一定挑战"
          - "软技能描述笼统，无法充分印证"
      2:
        label: "弱匹配"
        criteria:
          - "职业路径与岗位定位明显不符"
          - "软技能与岗位核心要求相反（内向→强销售岗）"
      1:
        label: "无匹配"
        criteria:
          - "职业定位完全不同（技术转销售，无桥接经历）"
    china_specific:
      - "国内招聘'稳定性'是隐性考量，频繁跳槽（< 1年/次超2次）影响角色匹配"
      - "管理岗通常要求有'带人经历'，需在简历中明确体现"

  constraint_match:
    label: "约束匹配"
    weight: 15
    description: "工作地点、薪资期望、工作时间等硬性约束的匹配程度"
    scoring:
      5:
        label: "完全匹配"
        criteria:
          - "工作城市/地点接受度与 JD 工作地点完全吻合"
          - "薪资期望在 JD 范围内或合理区间"
          - "工作时间接受度与岗位工时描述一致（接受大小周/接受出差）"
          - "开始时间（到岗时间）满足 JD 要求"
      4:
        label: "强匹配"
        criteria:
          - "主要约束满足，次要约束有 1 项偏差"
      3:
        label: "中等匹配"
        criteria:
          - "工作地点可接受但非首选"
          - "薪资期望略高于 JD 上限 10-20%"
      2:
        label: "弱匹配"
        criteria:
          - "工作地点需异地搬迁（无明确意愿）"
          - "薪资期望高于 JD 上限 > 20%"
      1:
        label: "无匹配"
        criteria:
          - "明确拒绝工作地点"
          - "薪资期望与 JD 差距超过 50%"
    china_specific:
      - "北京/上海/深圳岗位通常接受全国候选人，但需确认搬迁意愿"
      - "薪资谈判空间：互联网大厂通常有 10-15% 弹性，腰部公司更灵活"

# ============================================================
# 综合评分规则
# ============================================================
scoring_rules:
  calculation: "weighted_average"
  formula: "总匹配分 = Σ(维度得分 × 维度权重)"
  score_range: "5分制（1-5，可有小数）"

  calibration:
    perfect_match:  { min: 85, max: 100, label: "完美匹配，强烈推荐投递" }
    strong_match:   { min: 70, max: 85,  label: "强匹配，值得投递" }
    moderate_match: { min: 50, max: 70,  label: "中等匹配，投递需准备针对性说明" }
    weak_match:     { min: 25, max: 50,  label: "弱匹配，需大幅提升或重新定位" }
    no_match:       { min: 0,  max: 25,  label: "无匹配，不建议投递此岗位" }

  barrel_principle:
    rule: "若任一维度得分为 1（无匹配），整体评级不高于 weak_match"
    rationale: "硬性缺失（学历/证书/地点）无法通过其他维度弥补"

  missing_data_rule:
    rule: "缺少简历或 JD 任一，返回 insufficient confidence，拒绝给出匹配分"
    rationale: "匹配评估需要双方信息，单方面无法评估"

  per_dimension_confidence:
    rule: "每个维度应独立标注 confidence，最终整体 confidence 取最低值（木桶原则）"
    rationale: "让用户明确知道哪个维度数据最薄弱"

  gap_analysis:
    rule: "得分 < 4 的维度必须在 recommendations 中给出具体提升建议"
    rationale: "仅给分数不给方向对用户无帮助"
