# Offer 比较量纲 (Offer Comparison Rubric)
# Career Skills Marketplace — offer-comparator skill 使用
# 版本: 1.0.0

rubric_version: "1.0.0"
description: "多 Offer 综合比较评估标准，适用于中国职场语境，聚焦月薪制、五险一金、期权归属规则"
total_weight: 100

# ============================================================
# 评分维度（共 5 个，总权重 100%）
# ============================================================
dimensions:

  career_development:
    label: "职业发展"
    weight: 30
    description: "该 Offer 对候选人职业成长的长期价值：导师质量、技术栈、晋升通道、业务前景"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "有明确的带教 mentor 机制，且 mentor 有可查的行业背景"
          - "技术栈符合行业主流或前沿，不是遗留系统"
          - "晋升路径清晰且可实现（有案例支撑，非 HR 口头承诺）"
          - "所在业务处于增长期，岗位有扩展机会"
          - "有内外部培训体系（技术分享、外部课程报销）"
      4:
        label: "良好"
        criteria:
          - "成长环境良好，部分条件不如最优解但整体积极"
          - "技术栈有轻微落后但学习曲线合理"
          - "晋升通道存在，时间线稍长（2-3年）"
      3:
        label: "合格"
        criteria:
          - "成长机会一般，主要靠自驱"
          - "技术栈有明显局限，但可转行积累"
          - "晋升路径不透明，需自行争取"
      2:
        label: "待改进"
        criteria:
          - "明显存在天花板，业务萎缩或岗位边缘化"
          - "技术栈老旧，对市场竞争力有负面影响"
      1:
        label: "不合格"
        criteria:
          - "业务在收缩期，岗位存在被裁风险"
          - "纯执行性工作，无技术/业务积累价值"
    china_specific:
      - "大厂 title（阿里 P7、腾讯 T3-2 等）在下一次跳槽中有明显溢价效应"
      - "初创公司可能提供更高职级，但市场认可度取决于公司发展结果"
      - "技术岗需评估是否有机会参与核心系统，而非只做边缘支持"

  compensation:
    label: "薪资待遇"
    weight: 25
    description: "综合现金收入评估，以月为单位计算，涵盖五险一金缴纳基数、奖金结构和股权"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "月度现金（税后到手）高于候选人期望且在市场 75 分位以上"
          - "五险一金缴纳基数足额（按实际月薪），不压缩缴纳"
          - "年终奖/绩效奖金有历史发放记录，绩效系数规则透明"
          - "股权/RSU 归属周期合理（≤ 4 年），行权条件清晰"
          - "签约奖金（如有）无苛刻追回条款"
      4:
        label: "良好"
        criteria:
          - "综合收入达到候选人期望的 90% 以上"
          - "五险一金基本合规，偶有小幅压缩"
          - "奖金结构基本透明"
      3:
        label: "合格"
        criteria:
          - "月薪达到候选人期望，但奖金/股权存在不确定性"
          - "五险一金按最低标准缴纳"
      2:
        label: "待改进"
        criteria:
          - "综合收入低于候选人期望 20% 以上"
          - "五险一金存在违规情况（不缴或按最低工资缴纳）"
      1:
        label: "不合格"
        criteria:
          - "综合收入严重低于市场水平"
          - "薪资结构不透明，存在欺诈风险"
    china_specific:
      hourly_rate:
        label: "综合时薪计算方法"
        formula: "综合时薪 = 月到手 / (实际工作天数 × 实际工作小时数)"
        note: "用于对比不同工作强度的 Offer，相同月薪但 996 vs 965 的时薪差距接近 50%"
      social_insurance:
        label: "五险一金对比要点"
        fields:
          - "缴纳基数：是否按实际月薪（避免'按最低工资'缴纳）"
          - "公积金比例：5%-12%，比例越高实际收益越大（尤其一线城市购房场景）"
          - "补充公积金：部分大厂有，显著提升实际储蓄"
          - "城市差异：北京公积金上限与上海不同，需按城市计算"
      equity:
        label: "股权/期权归属规则（中国主流大厂参考）"
        vesting_schedules:
          tencent:  { period: "3年", schedule: "1/3 per year after cliff" }
          alibaba:  { period: "4年", schedule: "25% per year after 1-year cliff" }
          bytedance: { period: "4年", schedule: "25% per year after 1-year cliff" }
          huawei:   { period: "TBD", note: "虚拟股票（TUP），无二级市场，按绩效分配" }
        pre_ipo_note: "未上市公司期权流动性极低，估值与实际变现存在巨大不确定性"
      bonus_note:
        label: "年终奖绩效挂钩说明"
        criteria:
          - "询问近 3 年实际发放比例（而非名义上的 X 个月）"
          - "了解绩效考核标准（相对排名 vs 绝对目标）"
          - "确认发放时间（春节前 vs 春节后，影响离职时序规划）"

  company_platform:
    label: "公司平台"
    weight: 20
    description: "公司品牌价值、内部流动性、培训体系对候选人长期发展的赋能程度"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "公司品牌为行业头部，在简历中有显著溢价"
          - "内部有跨部门/跨业务流动机制，历史案例可查"
          - "系统化培训体系（内训+外训+导师制），有明确资源"
          - "公司处于上升通道，近 1-2 年有融资或营收增长"
      4:
        label: "良好"
        criteria:
          - "公司在细分领域有一定品牌认知度"
          - "内部流动存在但不系统化"
      3:
        label: "合格"
        criteria:
          - "公司品牌一般，但所在行业有参考价值"
          - "培训主要靠自学，资源有限"
      2:
        label: "待改进"
        criteria:
          - "公司品牌在行业内认知度低"
          - "无明显内部晋升或流动案例"
      1:
        label: "不合格"
        criteria:
          - "公司声誉有负面记录（欠薪、裁员争议、诉讼）"
          - "公司规模过小，平台价值无法赋能后续求职"
    china_specific:
      - "BATJ（字节、阿里、腾讯、京东）/美团/快手背景在国内互联网圈有显著光环效应"
      - "国企/央企提供的稳定性和体制内晋升路径是不同维度的平台价值"
      - "外企（500强跨国）平台在部分行业仍有溢价，但近年吸引力有所下降"

  life_quality:
    label: "生活质量"
    weight: 15
    description: "通勤、城市生活成本、户口机会、工作强度对候选人个人生活的综合影响"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "通勤单程 30 分钟内（地铁/步行），或提供班车覆盖"
          - "城市生活成本与薪资水平匹配，净储蓄率合理"
          - "提供落户名额（北上广竞争激烈城市），且归属条件清晰"
          - "工作强度为标准工时（正常 9-6 或 10-7，偶有加班），双休保障"
      4:
        label: "良好"
        criteria:
          - "通勤 30-60 分钟，可接受"
          - "工作强度偶有高峰期但整体可控"
          - "户口机会存在但条件有限制"
      3:
        label: "合格"
        criteria:
          - "通勤 1-1.5 小时，有一定精力损耗"
          - "工作强度大小周或弹性（实为轻度加班）"
          - "无户口机会"
      2:
        label: "待改进"
        criteria:
          - "通勤超 1.5 小时或需跨城"
          - "明显高强度（大小周+加班，综合时薪低）"
      1:
        label: "不合格"
        criteria:
          - "通勤不可行，需搬迁但候选人无意愿"
          - "工作强度损害健康（996/007 明文要求）"
    china_specific:
      hukou:
        label: "户口机会评估"
        criteria:
          - "北京：落户名额极稀缺，需确认是否真实可获得（不是口头承诺）"
          - "上海：居转户条件（缴纳社保满7年）与直接落户不同，需区分"
          - "杭州/成都/武汉等新一线：落户相对容易，溢价效应低于北上广"
          - "候选人无户口需求时，此项降权处理"
      city_cost:
        label: "城市实际生活成本"
        factors:
          - "房租：北京/上海核心区 vs 字节/阿里园区附近差异显著"
          - "餐饮/交通日常开支"
          - "若已有房产则通勤优先，若租房则需计算净储蓄"

  work_culture:
    label: "工作氛围"
    weight: 10
    description: "团队文化、管理风格、加班文化对日常工作体验的影响"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "团队有心理安全感，提倡直接沟通和合理质疑"
          - "上级领导有清晰的管理风格，预期可知"
          - "加班文化为项目驱动而非绩效表演，补偿机制存在"
          - "有实名 Glassdoor/脉脉好评，或可获取内部推荐人反馈"
      4:
        label: "良好"
        criteria:
          - "团队氛围基本积极，偶有沟通问题"
          - "管理风格可预期，无明显负面信号"
      3:
        label: "合格"
        criteria:
          - "文化中性，主要靠自我驱动"
          - "对工作氛围无特殊期待的候选人可接受"
      2:
        label: "待改进"
        criteria:
          - "有明显政治氛围（内斗信号、部门壁垒高）"
          - "加班文化强但无任何补偿机制"
      1:
        label: "不合格"
        criteria:
          - "脉脉/Glassdoor 有大量欠薪、PUA、职场霸凌负评"
          - "面试过程中已出现红旗信号（不尊重候选人时间、信息前后矛盾）"
    china_specific:
      overtime_culture:
        label: "加班文化识别"
        signals:
          positive: ["弹性工作制（真实）", "调休补偿", "项目完成后有恢复期"]
          negative: ["狼性文化", "大小周", "坐班文化（不到点不能走）", "朋友圈打卡"]
      pulse_check:
        label: "脉脉/内部信源参考"
        approach:
          - "搜索目标公司+部门在脉脉的近期帖子"
          - "联系内部员工做非正式背调（通过领英/校友）"
          - "面试官若是直属上级，评估其沟通风格是否匹配"

# ============================================================
# 综合评分规则
# ============================================================
scoring_rules:
  calculation: "weighted_average"
  formula: "综合 Offer 分 = Σ(维度得分 × 维度权重 / 100)"
  thresholds:
    excellent: { min: 4.5, max: 5.0, label: "强烈推荐接受" }
    good:      { min: 3.5, max: 4.5, label: "建议接受" }
    moderate:  { min: 2.5, max: 3.5, label: "可接受，结合个人情况决策" }
    weak:      { min: 1.5, max: 2.5, label: "谨慎考虑，建议继续争取其他 Offer" }
    poor:      { min: 0.0, max: 1.5, label: "不建议接受" }

  multi_offer_comparison:
    rule: "多 Offer 对比时，需输出每个 Offer 的维度得分矩阵，并标注各维度最优选项"
    output_format: "表格对比 + 各维度最高分高亮 + 综合推荐排序"

  missing_data_rule:
    rule: "Offer 关键信息缺失（月薪未确认、五险一金不透明）时，该维度 confidence 上限为 low，并在报告中提示候选人确认"
    rationale: "不完整信息下做出的比较结论可能误导决策"

  cannot_fabricate_rule:
    rule: "禁止推断候选人未提供的 Offer 细节，必须标注 '待确认' 并提示候选人获取"
    rationale: "Offer 信息错误会直接影响薪资谈判和最终决策"
