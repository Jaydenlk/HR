# 简历评估量纲 (Resume Rubric)
# Career Skills Marketplace — resume-evaluator skill 使用
# 版本: 1.0.0

rubric_version: "1.0.0"
description: "简历质量多维评估标准，适用于中国职场语境"
total_weight: 100

# ============================================================
# 评分维度
# ============================================================
dimensions:

  structure_clarity:
    label: "结构清晰度"
    weight: 20
    description: "简历整体组织结构是否符合阅读习惯，信息层级是否清晰"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "标准模块齐全（基本信息/教育/工作经历/项目/技能）"
          - "模块顺序符合目标岗位惯例（应届优先教育，工作优先经历）"
          - "每个模块边界清晰，视觉层级明显"
          - "单页（应届）或双页（3年以上经验）控制合理"
      4:
        label: "良好"
        criteria:
          - "主要模块存在，少一个次要模块（如无技能板块）"
          - "顺序基本合理，有轻微偏差"
          - "页面控制基本合理，轻微超页"
      3:
        label: "合格"
        criteria:
          - "模块存在但有缺失（如无项目经历）"
          - "顺序混乱或有争议（如自我评价放在开头）"
          - "单页严重压缩或多页内容稀疏"
      2:
        label: "待改进"
        criteria:
          - "缺少超过 2 个重要模块"
          - "结构明显不合逻辑"
          - "格式问题影响阅读"
      1:
        label: "不合格"
        criteria:
          - "无明确结构，以段落堆砌"
          - "关键信息（联系方式/教育）缺失"
    china_specific:
      - "中文简历通常不写生日、籍贯（部分岗位除外）"
      - "照片：互联网/外企通常不要求，传统行业/国企可能要求"
      - "自我评价板块在中文简历中普遍存在，但质量差异大"
      - "个人博客/GitHub 对技术岗是加分项"

  quantified_achievements:
    label: "量化成就"
    weight: 30
    description: "工作/项目经历中是否用数据描述成果，避免空洞描述"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "80% 以上的经历条目含具体数字（百分比/金额/规模/时间）"
          - "数字与职责直接相关，非凑数"
          - "使用 STAR 或 SAR 结构：情境→行动→结果"
          - "结果描述业务影响而非仅完成任务"
      4:
        label: "良好"
        criteria:
          - "60-80% 的经历条目含量化数据"
          - "大部分有行动+结果，少部分仅有行动"
      3:
        label: "合格"
        criteria:
          - "30-60% 的经历条目含量化数据"
          - "多数描述以完成任务为主，缺乏结果"
      2:
        label: "待改进"
        criteria:
          - "少于 30% 的条目有量化"
          - "大量使用'负责'、'参与'、'协助'等模糊动词"
      1:
        label: "不合格"
        criteria:
          - "完全无量化，全部为职责罗列"
          - "内容明显不真实或过于笼统"
    china_specific:
      - "'负责'开头是中文简历高频问题，应替换为具体动词"
      - "互联网岗位常用量化：DAU、GMV、转化率、QPS、覆盖用户数"
      - "若数据保密，可使用百分比或相对提升（如'提升30%'）"
      - "校招经历量化难，可量化团队规模、项目周期、成果展示场次"

  keyword_relevance:
    label: "关键词相关性"
    weight: 25
    description: "简历关键词与目标岗位 JD 的匹配程度（ATS 友好度）"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "核心技能关键词覆盖 JD 中 85% 以上的硬性要求"
          - "关键词自然融入经历描述，非堆砌"
          - "工具/语言/框架版本与 JD 要求对齐"
          - "行业词汇使用准确（非外行理解）"
      4:
        label: "良好"
        criteria:
          - "覆盖 JD 核心要求的 65-85%"
          - "关键词表达方式与 JD 基本一致"
      3:
        label: "合格"
        criteria:
          - "覆盖 JD 核心要求的 40-65%"
          - "部分关键词用了同义词或旧版本名称"
      2:
        label: "待改进"
        criteria:
          - "覆盖 JD 核心要求不足 40%"
          - "存在重要技能缺失但可补充"
      1:
        label: "不合格"
        criteria:
          - "与 JD 核心要求几乎无交集"
          - "大量无关关键词干扰"
    china_specific:
      - "中文 JD 常用'熟悉'/'精通'区分要求层级，应在简历中呼应"
      - "国内 ATS 使用率低于欧美，但大厂 HR 工具通常有关键词筛选"
      - "技能板块应区分：精通/熟练/了解，避免平铺"

  consistency:
    label: "一致性"
    weight: 15
    description: "简历内容的逻辑自洽性，无时间断层、无自我矛盾"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "时间线连续，无超过 6 个月的空白期（或有合理解释）"
          - "职级/薪资成长轨迹合理"
          - "技能描述与经历深度匹配（说精通则有大量实践证明）"
          - "教育背景与职业路径逻辑自洽"
      4:
        label: "良好"
        criteria:
          - "时间线基本连续，有轻微空白期"
          - "整体逻辑合理，少量细节可进一步解释"
      3:
        label: "合格"
        criteria:
          - "存在 6-12 个月空白期"
          - "部分技能声明与经历深度不匹配"
      2:
        label: "待改进"
        criteria:
          - "存在超过 12 个月空白期且无解释"
          - "明显前后矛盾（如职级倒退、技能与经历脱节）"
      1:
        label: "不合格"
        criteria:
          - "严重逻辑错误，可能引发 HR 质疑"
          - "日期错误（结束早于开始）"
    china_specific:
      - "校招中 gap year 越来越普遍，但需主动解释"
      - "创业/自由职业空白期需说明项目内容"
      - "跨行业跳槽需要通过技能/经历证明合理性"

  length_appropriateness:
    label: "长度合理性"
    weight: 10
    description: "简历篇幅是否与职业阶段匹配，信息密度是否适当"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "应届/1年内：严格 1 页"
          - "1-5年经验：1-1.5页，不超过2页"
          - "5年以上：可至 2 页，聚焦近 10 年"
          - "每条经历 2-4 行，无冗余"
      4:
        label: "良好"
        criteria:
          - "略超标准页数但内容充实"
          - "每条经历描述基本精炼"
      3:
        label: "合格"
        criteria:
          - "超过标准页数 0.5 页"
          - "有部分冗余但核心内容清晰"
      2:
        label: "待改进"
        criteria:
          - "超过标准页数 1 页以上"
          - "大量重复或低价值内容"
      1:
        label: "不合格"
        criteria:
          - "严重超长（应届超 3 页、工作超 5 页）"
          - "或严重过短（工作 5 年+ 仍 0.5 页）"
    china_specific:
      - "中文简历普遍比英文简历信息密度更高"
      - "国企/央企投递偶尔接受较长简历（附作品集/论文列表）"
      - "互联网大厂 HR 每份简历平均 6-10 秒扫描，精简更重要"

# ============================================================
# 综合评分规则
# ============================================================
scoring_rules:
  calculation: "weighted_average"
  formula: "总分 = Σ(维度得分 × 维度权重 / 100)"
  thresholds:
    excellent: { min: 4.5, max: 5.0, label: "优秀，可直接投递" }
    good:      { min: 3.5, max: 4.5, label: "良好，小幅优化后投递" }
    moderate:  { min: 2.5, max: 3.5, label: "中等，需针对性修改" }
    weak:      { min: 1.5, max: 2.5, label: "较弱，建议重写" }
    poor:      { min: 0.0, max: 1.5, label: "不合格，需重新梳理经历" }

  cannot_fabricate_rule:
    rule: "评分缺少原始简历时，必须返回 insufficient confidence，禁止基于推断给出分数"
    rationale: "没有简历内容就打分等同于编造"
