# 面试评估量纲 (Interview Rubric)
# Career Skills Marketplace — interview-evaluator skill 使用
# 版本: 1.0.0

rubric_version: "1.0.0"
description: "面试表现多维评估标准，适用于中国职场语境（包含群面、技术面、综合面）"
total_weight: 100

# ============================================================
# 评分维度（共 6 个，总权重 100%）
# ============================================================
dimensions:

  technical_depth:
    label: "技术深度"
    weight: 20
    description: "候选人在技术问题上的掌握程度，包括原理理解、实战经验、延伸知识"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "能准确解释底层原理，不仅停留在 API 层面"
          - "举例来自真实项目经历，有具体数据或场景"
          - "主动延伸至相关技术选型取舍，能对比多种方案"
          - "对前沿技术趋势有基本了解并能结合工作场景判断适用性"
      4:
        label: "良好"
        criteria:
          - "能正确解释核心原理，偶尔停留在表层"
          - "举例基本真实，细节有少量缺失"
          - "能对比常见方案，但缺乏深度权衡分析"
      3:
        label: "合格"
        criteria:
          - "掌握常见技术用法，对原理解释含糊"
          - "举例较为泛化，缺乏具体数据"
          - "能答出标准答案，但难以延伸"
      2:
        label: "待改进"
        criteria:
          - "技术概念模糊，存在明显误解"
          - "只能给出教科书定义，无法结合实践"
      1:
        label: "不合格"
        criteria:
          - "核心技术概念错误"
          - "无法回答基础问题"
    china_specific:
      handcoding:
        label: "手撕代码（Live Coding）评估"
        criteria:
          - "能在 20-30 分钟内独立完成算法题，代码可运行"
          - "边写边解释思路（大声思考），不仅输出代码"
          - "写完后主动分析时间/空间复杂度"
          - "面对 follow-up 问题能快速调整，不慌乱"
        common_traps:
          - "不考虑 edge case（空输入、整数溢出、单元素）"
          - "写完代码但无法解释为什么这样写"
          - "刷题套路明显但不理解本质"

  communication:
    label: "沟通表达"
    weight: 15
    description: "候选人表达清晰度、逻辑层次、应对压力时的沟通质量"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "回答结构清晰，有明确的开头（结论）、中间（论据）、结尾（总结）"
          - "语速适中，用词准确，避免大量填充词（'就是'/'然后'/'那个'）"
          - "面对追问不慌乱，能清晰区分'已知'和'不确定'"
          - "非语言沟通积极（眼神接触、微笑、姿态端正）"
      4:
        label: "良好"
        criteria:
          - "表达基本清晰，偶有逻辑跳跃但可理解"
          - "填充词出现但不干扰理解"
          - "面对追问能基本应对，偶有紧张"
      3:
        label: "合格"
        criteria:
          - "能传递核心信息，但组织较散乱"
          - "多次需要面试官引导才能回到正轨"
      2:
        label: "待改进"
        criteria:
          - "表达混乱，面试官需多次确认才能理解"
          - "回答常偏题或过于简短"
      1:
        label: "不合格"
        criteria:
          - "无法有效传递信息，严重影响面试进行"
    china_specific:
      - "中文职场面试中，过于谦虚（'我只是参与了'/'我不太确定'）会被认为缺乏自信"
      - "英语面试（外企/跨国团队）需额外评估英语流利度"
      - "视频面试需额外注意网络、背景、设备质量对评分的影响"

  structured_thinking:
    label: "结构化思维"
    weight: 20
    description: "候选人分析问题的框架能力：是否 MECE、是否有逻辑层次、能否快速建立分析框架"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "主动使用结构化框架（MECE、金字塔、5W1H、漏斗模型等）"
          - "拆解复杂问题时能快速识别关键变量并分层"
          - "能区分'问题现象'和'根本原因'"
          - "结论先行，论据支撑，条理清晰"
      4:
        label: "良好"
        criteria:
          - "有基本框架意识，偶有分类遗漏"
          - "大多数情况下结论清楚，但论证层次稍弱"
      3:
        label: "合格"
        criteria:
          - "有一定逻辑但缺乏系统框架，以流水账形式陈述"
          - "能识别主要因素，但常漏掉次要维度"
      2:
        label: "待改进"
        criteria:
          - "分析缺乏逻辑顺序，想到什么说什么"
          - "结论和论据混杂，难以区分"
      1:
        label: "不合格"
        criteria:
          - "完全无结构，无法有效分析问题"
    china_specific:
      product_design:
        label: "产品设计题评估要点"
        criteria:
          - "先澄清题目范围（用户群体、场景边界、成功指标）"
          - "用框架拆解（用户需求→核心功能→优先级→MVP→迭代路径）"
          - "能从数据/业务角度量化决策（如 DAU 目标、留存率提升）"
          - "最终给出具体方案，而非泛泛而谈"
        common_mistakes:
          - "直接跳入功能设计，跳过用户研究阶段"
          - "方案无优先级，全是'都很重要'"
          - "忽视技术可行性和资源约束"

  problem_solving:
    label: "问题解决"
    weight: 20
    description: "候选人面对模糊或复杂问题时的方法论：澄清假设、分解问题、创意思考、考虑边界"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "遇到模糊问题先主动澄清假设和约束条件"
          - "能快速识别核心约束并在约束内给出最优解"
          - "思考路径中有创意突破点，不局限于教科书方法"
          - "主动考虑 edge case 和极端情况"
          - "给出方案后能自我批评并提出改进方向"
      4:
        label: "良好"
        criteria:
          - "基本能澄清问题范围，给出合理方案"
          - "edge case 考虑不完整但能在引导下补充"
      3:
        label: "合格"
        criteria:
          - "给出可行方案，但未考虑约束和边界"
          - "方案缺乏创意，以标准答案为主"
      2:
        label: "待改进"
        criteria:
          - "方案存在明显缺陷，未能识别核心问题"
          - "面对追问无法有效补充"
      1:
        label: "不合格"
        criteria:
          - "无法给出可行方案，或方案完全脱离实际"
    china_specific:
      - "国内面试常考'如果用户量从1万增长到1亿，你的方案如何调整'—— 需要候选人具备扩展性思维"
      - "压力面（故意挑战答案）需评估候选人是否能坚持合理立场而非立刻妥协"

  culture_fit:
    label: "文化匹配"
    weight: 15
    description: "候选人的价值观、工作方式与目标公司/团队文化的契合程度"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "价值观陈述与公司公开文化高度一致（有具体例子支撑，非背诵）"
          - "能举出具体事例说明如何在团队冲突中找到共识"
          - "展现成长型思维：主动提及失败经历和从中学到的东西"
          - "对公司业务有真实了解，提问或表态基于事实而非泛泛赞美"
      4:
        label: "良好"
        criteria:
          - "基本价值观契合，少量表述略显表面"
          - "能举出 1-2 个相关事例"
      3:
        label: "合格"
        criteria:
          - "价值观无明显冲突，但契合程度一般"
          - "事例较泛，缺乏具体细节"
      2:
        label: "待改进"
        criteria:
          - "部分价值观与公司文化有潜在冲突"
          - "对公司了解极少，缺乏基本准备"
      1:
        label: "不合格"
        criteria:
          - "价值观与公司文化明显冲突"
          - "表现出功利目的（纯薪资驱动）而无职业认同"
    china_specific:
      group_interview:
        label: "群面（Group Discussion）评估要点"
        criteria:
          - "能在群面中自然承担协调者或贡献者角色，而非沉默"
          - "引导讨论时能推动共识形成，不独断"
          - "对他人观点能批判性补充，而非一味赞同"
          - "时间管理意识：关注剩余时间，推动结论产出"
        negative_signals:
          - "整场发言不超过 2 次（过于沉默）"
          - "不断打断他人或强行主导，缺乏协作"
          - "最终陈述时推翻小组结论，仅展示个人想法"

  question_quality:
    label: "提问质量"
    weight: 10
    description: "候选人向面试官提出的问题深度，反映其职业成熟度和对岗位的真实关注"
    scoring:
      5:
        label: "优秀"
        criteria:
          - "提问基于对公司/业务/团队的真实研究，非通用问题"
          - "问题具有双向价值：帮助候选人决策，也展示自己的思考深度"
          - "能追问面试官的回答，形成真实对话而非走流程"
          - "问题涉及实质性内容（技术选型、团队挑战、成功标准），而非仅问薪资福利"
      4:
        label: "良好"
        criteria:
          - "提问有针对性，显示基本准备"
          - "能提出 2-3 个有价值的问题"
      3:
        label: "合格"
        criteria:
          - "提出 1-2 个通用问题（如'团队氛围怎么样'），显示基本礼貌"
          - "缺乏深度，未体现对岗位的深入思考"
      2:
        label: "待改进"
        criteria:
          - "仅问薪资、假期等基础条件"
          - "或没有任何问题"
      1:
        label: "不合格"
        criteria:
          - "问题表现出对公司/岗位的负面预设"
          - "问题内容不合时宜或冒犯面试官"
    china_specific:
      - "直接在终面前问薪资在国内是惯例，不扣分；但在初面问薪资通常显得目的性过强"
      - "问'加班多吗'直接说出是禁忌，可转化为'团队的工作节奏是怎样的'"

# ============================================================
# 综合评分规则
# ============================================================
scoring_rules:
  calculation: "weighted_average"
  formula: "总分 = Σ(维度得分 × 维度权重 / 100)"
  thresholds:
    excellent: { min: 4.5, max: 5.0, label: "强烈推荐，优先发 offer" }
    good:      { min: 3.5, max: 4.5, label: "推荐录用" }
    moderate:  { min: 2.5, max: 3.5, label: "可考虑，结合其他候选人综合决策" }
    weak:      { min: 1.5, max: 2.5, label: "不推荐，存在明显短板" }
    poor:      { min: 0.0, max: 1.5, label: "不录用" }

  cannot_fabricate_rule:
    rule: "评分必须基于面试实际发生的记录（笔记/录音/面试官回忆），禁止基于简历推断面试表现"
    rationale: "简历优秀不等于面试表现优秀，评分来源必须一致"

  barrel_principle:
    rule: "若技术深度或结构化思维任一维度得分为 1，整体评级不高于 moderate"
    rationale: "核心能力维度不达标无法通过其他维度弥补"
