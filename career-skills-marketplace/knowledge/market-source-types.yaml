meta:
  name: 市场数据来源类型目录
  version: "2.0"
  confidence: medium
  source_policy: "基于平台公开信息及行业使用经验汇编"
  last_reviewed_at: "2026-05-26"
  limitations:
    - "各平台数据质量因使用方式不同差异较大"
    - "平台政策和内容质量随时间变化"
    - "信息时效性需结合发布时间判断"

grade_definition:
  A: "官方或经核实的权威数据，可直接引用"
  B: "来源可靠，多数情况下准确，建议交叉验证"
  C: "用户自述数据，仅供参考，不能直接作为事实引用"
  D: "匿名信息或传言，高度不确定，需谨慎对待"

sources:
