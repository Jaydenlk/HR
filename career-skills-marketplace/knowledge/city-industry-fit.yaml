      - industry: 互联网/科技
        strength: high
        key_players: [腾讯, 平安科技, 汇丰科技]
      - industry: 金融科技
        strength: high
        key_players: [平安集团, 招商银行]
      - industry: 新能源/电动车
        strength: high
        key_players: [比亚迪, 宁德时代深圳研发]
      - industry: 半导体
        strength: medium
        key_players: [中芯国际深圳, 汇顶科技]
    typical_salary_level:
      relative: high
      note: "硬件和科技岗位薪资高，整体与北上相当"
    cost_of_living:
      relative: high
      note: "房价高，但相比北京上海略低，生活便利"
    tech_hub_strength: high
    quality_of_life:
      pros:
        - "气候宜人，冬天温暖"
        - "城市年轻化，活力足"
        - "创业氛围浓，创新文化强"
        - "紧邻香港，国际视野开阔"
      cons:
        - "本地文化积淀相对薄弱"
        - "房价压力大"
        - "部分职业发展路径相对单一"
    hukou_difficulty: medium
    notes: "硬件和创新高地，华为腾讯双巨头带动生态"

  - id: hangzhou
