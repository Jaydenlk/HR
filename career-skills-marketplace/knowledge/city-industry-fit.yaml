      note: "房价低于北上深，生活成本适中，性价比较高"
    tech_hub_strength: high
    quality_of_life:
      pros:
        - "宜居性强，自然环境美"
        - "生活成本相对合理"
        - "互联网创业生态活跃"
        - "政府数字化程度高"
      cons:
        - "产业结构相对集中，阿里依赖度高"
