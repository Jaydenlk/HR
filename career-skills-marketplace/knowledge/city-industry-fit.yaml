meta:
  name: 城市与行业适配分析
  version: "1.0"
  confidence: medium
  source_policy: "基于公开信息汇编"
  last_reviewed_at: "2026-05-26"
  limitations:
    - "数据为概括性描述，具体情况因人而异"
    - "城市发展动态，数据存在时效性"
    - "薪资水平因岗位和行业差异显著"

cities:
  - id: beijing
    name: 北京
    dominant_industries:
      - industry: 互联网/科技
        strength: high
        key_players: [字节跳动, 百度, 京东, 美团, 小米]
      - industry: 金融/金融科技
        strength: high
        key_players: [工商银行, 中国平安, 蚂蚁集团北京研发]
      - industry: 政府/国企
        strength: high
        notes: "央企总部密集，政策资源丰富"
      - industry: 教育/教育科技
        strength: high
        key_players: [好未来, 猿辅导]
      - industry: 媒体/内容
        strength: medium
        key_players: [爱奇艺, 芒果TV北京, 各大媒体集团]
      - industry: 汽车/新能源
        strength: medium
        key_players: [理想汽车, 小鹏北京研发]
    typical_salary_level:
      relative: high
      note: "互联网和金融岗位薪资全国最高，国企相对较低"
    cost_of_living:
      relative: high
      note: "房价居全国前列，生活成本高，但公共服务完善"
    tech_hub_strength: high
    quality_of_life:
      pros:
        - "文化资源极其丰富，博物馆、演出等"
        - "医疗教育资源全国最优"
        - "职场网络效应强，人脉资源密集"
        - "政策信息获取优势"
      cons:
        - "雾霾和空气质量问题（近年有改善）"
        - "交通拥堵严重，通勤时间长"
        - "房价高，安家成本大"
        - "户籍限制较多"
    hukou_difficulty: high
    notes: "全国政治和文化中心，互联网大厂和国企双轨并行"

  - id: shanghai
    name: 上海
    dominant_industries:
      - industry: 金融/投资银行
        strength: high
        key_players: [各大外资投行, 证券公司, 保险集团]
      - industry: 跨国企业/外企
        strength: high
        notes: "外企亚太区总部密集"
      - industry: 互联网/科技
        strength: high
        key_players: [拼多多, 携程, 哔哩哔哩, 华为上海研发]
      - industry: 制造业/高端制造
        strength: medium
        key_players: [特斯拉上海工厂, 半导体企业]
      - industry: 汽车/新能源
        strength: high
        key_players: [特斯拉, 上汽集团, 蔚来]
      - industry: 生物医药
        strength: high
        key_players: [张江高科技园区众多药企]
    typical_salary_level:
      relative: high
      note: "金融和外企薪资高，整体薪资水平与北京相当"
    cost_of_living:
      relative: high
      note: "房价高，生活成本接近北京，但城市环境和服务品质更优"
    tech_hub_strength: high
    quality_of_life:
      pros:
        - "国际化程度高，外语工作机会多"
        - "城市规划完善，宜居性强"
        - "餐饮、娱乐、购物选择丰富"
        - "地铁网络发达，通勤较便利"
      cons:
        - "房价居全国前列"
        - "部分岗位英语要求高，对语言能力有要求"
        - "生活节奏快，竞争激烈"
    hukou_difficulty: high
    notes: "全国金融中心，外企和互联网双核心"

  - id: shenzhen
