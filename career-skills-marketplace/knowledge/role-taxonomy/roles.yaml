meta:
  total: 30
  note: 薪资数据为2026年参考框架，一线城市（北上广深杭）标准，以实际offer为准

roles:
  # ── 技术研发（tech）────────────────────────────────────────────

  - id: backend
    name: 后端工程师
    category: tech
    typical_requirements:
      education: 本科及以上，计算机/软件工程/相关理工科
      experience_years: "0-2年（初级），3-5年（中级），5年以上（高级）"
      hard_skills:
        - Java/Go/C++主流后端语言（按公司偏好）
        - 分布式系统设计（微服务/消息队列/缓存）
        - 数据库设计（MySQL/Redis/NoSQL）
        - 高并发/高可用架构
      soft_skills:
        - 问题分解与系统性思维
        - 代码评审和文档习惯
        - 跨团队协作（前端/产品/运维）
    hidden_preferences:
      - 大厂优先考察LeetCode刷题深度（中等200+/困难50+为基础门槛）
      - 系统设计题考察「权衡意识」而非最优解，能说出trade-off优先
      - Java岗偏好有源码阅读经验（Spring/Dubbo源码）
      - Go岗偏好有高并发实战经验（goroutine调度理解）
      - 有开源贡献或知名项目经历可跳过部分面试环节
    interview_focus:
      behavioral: 10
      case_study: 0
      technical: 80
      culture_fit: 10
    resume_keywords:
      - 分布式系统、微服务架构、高并发
      - Java/Go/Python、Spring Boot、gRPC
      - MySQL调优、Redis、Kafka、RocketMQ
      - 系统重构、性能优化、QPS、TPS
      - 代码质量、单元测试覆盖率
    common_red_flags:
      - 简历项目描述只有功能没有数据（QPS、延迟、规模）
      - 技术栈写了10+种但每种只有1年经验
      - 项目描述与实际对话深度不符（背简历）
      - 没有线上问题排查经验
      - 代码题思路混乱或边界处理遗漏
    salary_range_reference:
      junior: 20-35k/月（应届+1年）
      mid: 35-60k/月（3-5年）
      senior: 55-100k/月（5年以上）
      note: 仅供框架使用，字节/拼多多溢价可达30-50%

  - id: frontend
    name: 前端工程师
    category: tech
    typical_requirements:
      education: 本科及以上，计算机相关专业（非科班可通过作品集弥补）
      experience_years: "0-2年（初级），3-5年（中级），5年以上（高级）"
      hard_skills:
        - React/Vue主流框架（至少精通一个）
        - JavaScript/TypeScript
        - 性能优化（首屏加载/渲染优化）
        - 工程化（Webpack/Vite/CI流程）
      soft_skills:
        - 审美和产品感（与设计协作）
        - 细节关注（像素级还原）
        - 自驱学习（生态更新快）
    hidden_preferences:
      - 大厂更看重工程化能力而非框架使用
      - Node.js全栈能力加分（BFF层开发）
      - 移动端（React Native/Flutter）经验加分
      - 有大流量场景性能优化案例
    interview_focus:
      behavioral: 10
      case_study: 0
      technical: 75
      culture_fit: 15
    resume_keywords:
      - React/Vue、TypeScript、工程化
      - 首屏优化、懒加载、性能监控
      - 组件库封装、设计系统
      - 跨端开发、小程序
      - Webpack/Vite构建优化
    common_red_flags:
      - 简历里只有CRUD项目无性能优化案例
      - 不了解浏览器渲染机制
      - 对CSS布局基础薄弱
      - 无单元测试经验
    salary_range_reference:
      junior: 15-28k/月
      mid: 28-50k/月
      senior: 45-85k/月
      note: 仅供框架使用，前端薪资略低于后端约10-15%

  - id: algorithm
    name: 算法工程师
    category: tech
    typical_requirements:
      education: 硕士及以上（顶尖公司优先博士），计算机/数学/统计/电子
      experience_years: "0-2年（初级），2-5年（中级），5年以上（高级/专家）"
      hard_skills:
        - 机器学习/深度学习理论（PyTorch/TensorFlow）
        - 推荐系统/搜索/NLP/CV/大模型（按方向选一）
        - 数学基础（线性代数、概率统计、最优化）
        - Python工程化（数据处理/模型服务化）
      soft_skills:
        - 实验设计和数据分析能力
        - 跨团队沟通（与工程/产品对齐效果）
        - 快速迭代与假设验证
    hidden_preferences:
      - 顶会论文（NeurIPS/ICML/ACL等）极大加分，可跳过笔试
      - 实习经历（尤其大厂顶组）比学历更重要
      - 有工业界落地经验（模型从实验到上线）比纯学术更受欢迎
      - LLM方向2024年起成为优先考察点
    interview_focus:
      behavioral: 10
      case_study: 20
      technical: 65
      culture_fit: 5
    resume_keywords:
      - 推荐算法、排序模型、召回系统
      - NLP/CV/大模型、Transformer、BERT/GPT
      - A/B测试、在线实验、离线评估
      - 模型优化、蒸馏、量化、推理加速
      - 顶会论文（一作加分）
    common_red_flags:
      - 只有课程项目无真实数据集经验
      - 不能解释模型选择的业务原因
      - 对离线指标和在线指标不一致无处理经验
      - 论文列出但说不清创新点
    salary_range_reference:
      junior: 25-45k/月（硕士应届）
      mid: 45-80k/月（3-5年）
      senior: 75-150k/月（5年以上/专家）
      note: 仅供框架使用，大模型方向2024-2026溢价显著

  - id: test-engineer
    name: 测试工程师
    category: tech
    typical_requirements:
      education: 本科及以上，计算机相关专业
      experience_years: "0-2年（初级），2-5年（中级），5年以上（高级/测试架构）"
      hard_skills:
        - 测试方法论（功能/性能/安全/自动化）
        - 自动化测试框架（Selenium/Appium/pytest）
        - 性能测试工具（JMeter/Locust）
        - 基础编程（Python/Java）
      soft_skills:
        - 破坏性思维（找bug而非验证功能）
        - 流程规范意识
        - 与研发高效协作
    hidden_preferences:
      - 测试开发（SDET）方向薪资远高于纯手动测试
      - 性能/安全测试专项能力加分
      - CI/CD流程集成经验加分
    interview_focus:
      behavioral: 15
      case_study: 25
      technical: 50
      culture_fit: 10
    resume_keywords:
      - 自动化测试、测试开发、SDET
      - 性能测试、压测、JMeter
      - 测试框架搭建、CI/CD集成
      - Bug发现率、测试覆盖率
    common_red_flags:
      - 只做手动测试无自动化经验
      - 无测试用例设计思路
    salary_range_reference:
      junior: 12-22k/月
      mid: 22-40k/月
      senior: 38-65k/月
      note: 仅供框架使用，测试开发方向可达后端85%薪资

  - id: devops
    name: DevOps/SRE工程师
    category: tech
    typical_requirements:
      education: 本科及以上，计算机/网络工程
      experience_years: "2-5年（中级），5年以上（高级/架构）"
      hard_skills:
        - Kubernetes/Docker容器化
        - CI/CD流程（Jenkins/GitHub Actions/ArgoCD）
        - 云平台运维（阿里云/腾讯云/AWS）
        - 监控告警（Prometheus/Grafana/ELK）
      soft_skills:
        - 应急响应和值班意识
        - 文档化习惯
        - 成本优化意识
    hidden_preferences:
      - SRE（站点可靠性工程）方向薪资对标后端
      - 有大规模（10万+节点）集群运维经验
      - 混沌工程经验加分
    interview_focus:
      behavioral: 15
      case_study: 20
      technical: 60
      culture_fit: 5
    resume_keywords:
      - Kubernetes、Docker、微服务部署
      - CI/CD流水线、自动化运维
      - 可观测性（Observability）、SLO/SLA
      - 故障恢复、灾备方案
    common_red_flags:
      - 无Kubernetes实际生产经验
      - 无oncall/值班经历
    salary_range_reference:
      junior: 18-30k/月
      mid: 30-55k/月
      senior: 50-90k/月
      note: 仅供框架使用

  - id: ai-engineer
    name: AI应用工程师
    category: tech
    typical_requirements:
      education: 本科及以上，计算机/数学相关
      experience_years: "0-3年（初级，大模型应用新兴岗位），3-6年（中级）"
      hard_skills:
        - LLM API调用和Prompt工程
        - RAG（检索增强生成）架构
        - LangChain/LlamaIndex等框架
        - Python工程化和API开发
      soft_skills:
        - 快速原型能力
        - 对模型能力边界的理解
        - 业务场景转化能力
    hidden_preferences:
      - 2024年后新兴岗位，市场供需失衡（需求大于供给）
      - 有端到端AI产品落地经验（非Demo）极大加分
      - 懂微调（Fine-tuning）的候选人极稀缺
    interview_focus:
      behavioral: 15
      case_study: 30
      technical: 45
      culture_fit: 10
    resume_keywords:
      - LLM应用开发、RAG、Agent
      - Prompt工程、思维链（CoT）
      - 向量数据库（Weaviate/Chroma/Pinecone）
      - AI产品落地、效果评估
    common_red_flags:
      - 只会调API不懂模型原理
      - 无真实用户场景的项目经验
    salary_range_reference:
      junior: 25-40k/月
      mid: 40-70k/月
      senior: 65-120k/月
      note: 仅供框架使用，2026年供需紧张，溢价明显

  - id: embedded-engineer
    name: 嵌入式工程师
    category: tech
    typical_requirements:
      education: 本科及以上，电子/计算机/自动化
      experience_years: "0-3年（初级），3-6年（中级），6年以上（高级）"
      hard_skills:
        - C/C++嵌入式编程
        - RTOS（FreeRTOS/RT-Thread）
        - 单片机/ARM Cortex-M系列
        - 硬件调试（示波器/逻辑分析仪）
      soft_skills:
        - 硬件/软件协作意识
        - 严谨的bug排查习惯
    hidden_preferences:
      - 汽车电子（AUTOSAR）经验在新能源行业极为抢手
      - FPGA经验加分（芯片/通信方向）
    interview_focus:
      behavioral: 10
      case_study: 15
      technical: 70
      culture_fit: 5
    resume_keywords:
      - RTOS、驱动开发、BSP
      - CAN/LIN总线、车载协议
      - 功耗优化、内存管理
    common_red_flags:
      - 只有校内课程项目无硬件调试经验
    salary_range_reference:
      junior: 12-22k/月
      mid: 22-40k/月
      senior: 38-70k/月
      note: 仅供框架使用，汽车电子方向溢价约20-30%

  # ── 产品管理（product）────────────────────────────────────────────

  - id: product-manager-c
    name: C端产品经理
    category: product
    typical_requirements:
      education: 本科及以上，不限专业（心理/传播/商科有优势）
      experience_years: "0-2年（初级/助理PM），2-5年（P5/6），5年以上（高级/产品负责人）"
      hard_skills:
        - 用户研究和需求分析
        - 原型设计（Figma/Axure）
        - 数据分析（埋点设计/指标体系）
        - 竞品分析和市场调研
      soft_skills:
        - 强共情能力（理解用户心理）
        - 跨职能推动力（驱动研发/设计/运营）
        - 结构化表达（PRD写作能力）
        - 优先级判断力
    hidden_preferences:
      - 大厂C端PM考察「品味感」和「用户感」，而非方法论背诵
      - 面试时会让候选人设计一个他们熟悉的产品改进
      - 有真实产品从0到1经历优先于多个改版经历
      - 数据驱动决策案例（用数据推翻直觉）极加分
      - 不要把产品经验都归因于自己，面试官会追问团队贡献
    interview_focus:
      behavioral: 25
      case_study: 45
      technical: 10
      culture_fit: 20
    resume_keywords:
      - 用户增长、DAU、留存率、转化漏斗
      - 产品迭代、A/B测试、MVP
      - 用户体验、交互设计、用户故事
      - 需求优先级、PRD、产品路线图
    common_red_flags:
      - 只说功能做了什么，不说为什么做和效果如何
      - 数据全是虚词（显著提升、大幅优化）无具体数字
      - 把团队成果完全归因于自己
      - 不了解竞品
      - 只会用产品方法论包装，无真实用户接触
    salary_range_reference:
      junior: 15-28k/月（0-2年）
      mid: 28-55k/月（3-5年）
      senior: 50-100k/月（5年以上）
      note: 仅供框架使用

  - id: product-manager-b
    name: B端产品经理
    category: product
    typical_requirements:
      education: 本科及以上，商科/计算机/工业工程有优势
      experience_years: "1-3年（初级），3-6年（中级），6年以上（高级/解决方案架构）"
      hard_skills:
        - 业务流程分析（泳道图/流程梳理）
        - 数据库和接口基础理解
        - 客户调研和需求挖掘
        - ERP/CRM/中台系统理解
      soft_skills:
        - 逻辑严密性（客户需求转化为系统需求）
        - 耐心和韧性（B端迭代慢，推进难）
        - 商务沟通能力（直面客户）
    hidden_preferences:
      - 懂行业领域（金融/供应链/制造）的B端PM溢价极高
      - 有技术背景（能看代码/理解API）的B端PM更受欢迎
      - 懂数据库设计的B端PM比纯产品背景更抢手
    interview_focus:
      behavioral: 20
      case_study: 40
      technical: 20
      culture_fit: 20
    resume_keywords:
      - 业务流程梳理、需求文档、SRS
      - 中台建设、数据中台、业务中台
      - 客户成功率、系统稳定性、DAU（内部用户）
      - API设计、数据模型、系统集成
    common_red_flags:
      - C端思维做B端产品（忽视权限/流程/审计）
      - 无法清晰描述一个完整的业务流程
      - 不理解企业采购决策链
    salary_range_reference:
      junior: 12-22k/月
      mid: 22-45k/月
      senior: 40-80k/月
      note: 仅供框架使用，金融/供应链B端PM溢价约20%

  # ── 运营（operations）────────────────────────────────────────────

  - id: user-operations
    name: 用户运营
    category: operations
    typical_requirements:
      education: 本科及以上，不限专业
      experience_years: "0-2年（初级），2-5年（中级），5年以上（高级/用户中心负责人）"
      hard_skills:
        - 用户分层和标签体系
        - 私域运营（企业微信/社群/个推）
        - 数据分析（用户行为/留存/流失）
        - 活动策划和执行
      soft_skills:
        - 强执行力
        - 细腻的用户洞察
        - 数据敏感度
    hidden_preferences:
      - 有具体留存率提升数据（如30天留存从X%到Y%）
      - 私域运营经验（企业微信生态）2023年后优先
      - AARRR增长模型实战经验
    interview_focus:
      behavioral: 30
      case_study: 40
      technical: 10
      culture_fit: 20
    resume_keywords:
      - 用户生命周期管理、留存率
      - 私域运营、社群管理
      - 用户分层、RFM模型
      - 活动ROI、MAU增长
    common_red_flags:
      - 运营数据全是过程指标（执行了多少活动），无结果指标
      - 不懂用户漏斗分析
    salary_range_reference:
      junior: 8-16k/月
      mid: 15-28k/月
      senior: 25-50k/月
      note: 仅供框架使用

  - id: content-operations
    name: 内容运营
    category: operations
    typical_requirements:
      education: 本科及以上，中文/传播/新闻有优势
      experience_years: "0-2年（初级），2-5年（中级），5年以上（内容负责人）"
      hard_skills:
        - 内容策划和编辑能力
        - 平台规则理解（抖音/小红书/微信等）
        - 数据分析（内容表现/完播率/互动率）
        - MCN或创作者生态管理
      soft_skills:
        - 内容品味和敏锐度
        - 爆款内容嗅觉
        - 跨内容类型适应能力
    hidden_preferences:
      - 有过爆款内容（百万播放/10万+阅读）案例
      - 深度理解平台算法逻辑
      - AIGC内容生产经验2024年后加分
    interview_focus:
      behavioral: 25
      case_study: 40
      technical: 5
      culture_fit: 30
    resume_keywords:
      - 内容策划、选题策略、爆款案例
      - 平台运营（抖音/小红书/B站）
      - 达人合作、MCN管理
      - 内容数据分析、完播率、互动率
    common_red_flags:
      - 简历无具体爆款内容案例
      - 对平台算法逻辑理解停留在表面
    salary_range_reference:
      junior: 8-15k/月
      mid: 15-28k/月
      senior: 25-50k/月
      note: 仅供框架使用

  - id: growth-operations
    name: 增长运营
    category: operations
    typical_requirements:
      education: 本科及以上，统计/计算机/商科有优势
      experience_years: "1-3年（初级），3-6年（中级/增长PM），6年以上（增长负责人）"
      hard_skills:
        - A/B实验设计和分析
        - 渠道投放（信息流/SEM）
        - 增长漏斗优化（激活/留存/变现）
        - SQL数据查询
      soft_skills:
        - 数据敏感度
        - 快速假设-验证循环
        - 跨渠道整合思维
    hidden_preferences:
      - 有从0到1冷启动经验（而非优化存量）
      - 懂SEO/ASO优化
      - 具体ROI数据（投产比、CAC/LTV）
    interview_focus:
      behavioral: 20
      case_study: 45
      technical: 20
      culture_fit: 15
    resume_keywords:
      - 用户增长、DAU/MAU增长
      - 投放ROI、CAC/LTV
      - A/B测试、漏斗优化
      - 裂变活动、私域增长
    common_red_flags:
      - 无具体增长数据（只说"参与了增长项目"）
      - 不懂A/B测试统计显著性
    salary_range_reference:
      junior: 12-22k/月
      mid: 22-40k/月
      senior: 38-70k/月
      note: 仅供框架使用

  # ── 市场营销（marketing）────────────────────────────────────────────

  - id: marketing
    name: 市场营销专员/经理
    category: marketing
    typical_requirements:
      education: 本科及以上，市场营销/传播/商科
