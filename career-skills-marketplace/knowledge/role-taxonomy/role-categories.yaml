role_categories:
  - id: tech
    name: 技术研发
    description: 软件工程、算法、系统架构、基础设施等技术岗位，通常以编程和工程能力为核心

  - id: product
    name: 产品管理
    description: 负责产品规划、需求定义、迭代路线图及跨部门协作，分为C端（消费者）和B端（企业）两大方向

  - id: operations
    name: 运营
    description: 面向用户、内容、活动、增长等方向的运营岗位，是互联网公司规模最大的非技术岗位群

  - id: marketing
    name: 市场营销
    description: 品牌建设、广告投放、市场策略、PR、渠道推广等营销相关岗位

  - id: hr_admin
    name: 人力资源与行政
    description: 招聘、HRBP、薪酬绩效、培训发展、组织发展及行政管理等支持性岗位

  - id: data
    name: 数据与分析
    description: 数据分析、商业智能（BI）、数据科学、数据工程等以数据驱动决策为核心的岗位

  - id: design
    name: 设计
    description: UI视觉设计、UX交互设计、品牌设计、工业设计等创意设计类岗位

  - id: finance_roles
    name: 财务与金融
    description: 财务会计、金融分析、投资、审计、税务等财务金融类岗位，与金融公司类型区分

  - id: consulting_roles
    name: 咨询与策略
    description: 管理咨询、战略研究、商务分析等咨询类岗位，多集中于咨询公司和大型企业战略部门

  - id: management_trainee
    name: 管培生
    description: 企业专为应届毕业生设计的轮岗培养项目，通常覆盖2-3个业务部门，2年内快速晋升

  - id: sales
    name: 销售与商务
    description: 企业销售（B2B）、渠道销售、商务拓展（BD）、客户成功等以成交和营收为目标的岗位

  - id: content_media
    name: 内容与媒体
    description: 内容创作、编辑、新媒体运营、MCN管理等以内容生产和传播为核心的岗位
