name: career-principal
version: "1.0.0"
purpose: "理解用户求职意图，编排调用对应 skill，汇总结构化结论"
role: orchestrator

when_to_use:
  - "用户提到求职、简历、JD、面试、offer、公司、薪资、职业规划"
  - "用户直接请求求职帮助"
  - "用户粘贴了 JD 或简历文本"

when_not_to_use:
  - "与求职完全无关的话题"
  - "用户明确指定了要调用的具体 skill"

inputs_required:
  user_message:
    type: string
    description: "用户的自然语言消息"

optional_context:
  resume_text: { type: string }
  jd_text: { type: string }
  user_profile: { type: object }

sub_skills:
  # Layer 1: Core Reasoning
  - profile-builder
  - jd-analyzer
  - resume-tailor
  - match-diagnosis
  - source-quality-auditor
  # Layer 2: Career Execution
  - opportunity-intelligence
  - application-strategist
  - application-tracker
  - daily-plan-generator
  - networking-message-writer
  - referral-strategy
  - follow-up-message-writer
  # Layer 3: Interview
  - interview-intelligence
  - mock-interviewer
  - interview-debrief
  - question-bank-builder
  - company-interview-playbook
  - behavioral-story-builder
  - technical-interview-coach
  - case-interview-coach
  # Layer 4: Market Intelligence
  - market-radar
  - xhs-interview-miner
  - nowcoder-tech-miner
  - wechat-insight-reader
  - salary-radar
  - offer-comparator
  - company-risk-auditor
  - industry-trend-analyst
  # Layer 5: Career Strategy
  - career-path-planner
  - role-transition-advisor
  - skill-gap-planner
  - learning-roadmap-builder
  - personal-brand-builder
  - portfolio-project-advisor
  - graduate-school-vs-job-advisor
  - city-industry-fit-advisor

evidence_required:
  - "每个结论必须可追溯到 evidence"
  - "涉及市场事实必须经过 source-quality-auditor"

tools_allowed: [Read, Grep, Glob]

confidence_policy:
  rule: "取所有 sub-skill confidence 中最低值"

knowledge_dependencies:
  - path: knowledge/company-taxonomy/companies.seed.yaml
    usage: "公司基本信息、公司类型和已知风险信号查询"
    required: false
    degradation: "仅使用 JD 原文中的公司信息，不补充知识图谱数据"
  - path: knowledge/company-taxonomy/company-types.yaml
    usage: "判断公司发展阶段（初创/成长/成熟）"
    required: false
    degradation: "company_context.stage 标注为 unknown"
  - path: knowledge/role-taxonomy/roles.yaml
    usage: "岗位技能要求参考，辅助匹配诊断"
    required: false
    degradation: "仅依赖 JD 中的显性技能要求"
  - path: knowledge/market-vocabulary/china-job-search-terms.yaml
    usage: "中国求职黑话解析（996/大小周/虚拟股等）"
    required: false
    degradation: "使用内置术语表，可能覆盖不全"

failure_modes:
  - sub_skill_unavailable: "降级到可用 skill + 知识图谱查询"
  - insufficient_input: "追问缺失信息（最多3轮）"
  - out_of_scope: "明确拒绝 + 建议其他方向"
