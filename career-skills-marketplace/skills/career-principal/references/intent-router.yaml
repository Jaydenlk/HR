description: "求职主理人意图路由表，定义37种意图的触发条件、所需输入和调度规则"
version: "2.0.0"

intents:

  - name: analyze_jd
    label: "分析职位描述"
    trigger_examples:
      - "帮我看这个 JD"
      - "这个岗位值不值得投"
      - "分析一下这个职位"
      - "这个 JD 要求高吗"
      - "职位要求有哪些"
      - "这个岗位主要做什么"
    required_inputs:
      - jd_text
    missing_input_questions:
      jd_text: "请粘贴 JD 原文或提供链接，这样我才能分析具体要求、隐含条件和薪资合理性"
    primary_skill: jd-analyzer
    secondary_skills:
      - source-quality-auditor
    confidence_gate: "jd_text 字符数 >= 50"
    fallback: "JD 信息太少，只能做有限分析 (confidence: low)"

  - name: tailor_resume
    label: "针对 JD 优化简历"
    trigger_examples:
      - "帮我改简历"
      - "简历针对这个 JD 优化一下"
      - "我简历需要怎么改才能符合这个职位"
      - "帮我写一版针对这个岗位的简历"
      - "简历怎么更好地匹配这个 JD"
    required_inputs:
      - resume_text
      - jd_text
    missing_input_questions:
      resume_text: "请提供你的简历原文，这样我才能针对性地优化而不是凭空改写"
      jd_text: "请提供目标职位的 JD，我需要了解岗位要求才能有针对性地调整简历"
    primary_skill: resume-tailor
    secondary_skills:
      - jd-analyzer
      - profile-builder
    confidence_gate: "resume_text 字符数 >= 100 且 jd_text 字符数 >= 50"
    fallback: "输入信息不足，无法生成有针对性的简历建议 (confidence: low)"

  - name: match_diagnosis
    label: "诊断匹配度"
    trigger_examples:
      - "我适合这个岗位吗"
      - "我和这个职位的匹配度怎么样"
      - "我有多大机会"
      - "值得投这个职位吗"
      - "我的背景符合要求吗"
      - "这个 JD 我能达标几条"
    required_inputs:
      - resume_text
      - jd_text
    missing_input_questions:
      resume_text: "请提供你的简历，匹配度分析需要了解你的实际经历和技能"
      jd_text: "请提供 JD 原文，我需要知道岗位要求才能评估匹配情况"
    primary_skill: match-diagnosis
    secondary_skills:
      - jd-analyzer
      - profile-builder
    confidence_gate: "resume_text 字符数 >= 100 且 jd_text 字符数 >= 50"
    fallback: "缺少简历或 JD，只能给出框架性评估 (confidence: low)"

  - name: career_direction
    label: "职业方向规划"
    trigger_examples:
      - "我不知道下一步往哪个方向走"
      - "帮我规划职业路径"
      - "我该转行吗"
      - "我适合做什么方向"
      - "3年后我应该往哪发展"
      - "产品经理和运营哪个更适合我"
    required_inputs: []
    optional_inputs:
      - resume_text
      - user_profile
    missing_input_questions:
      resume_text: "如果能提供你的简历或工作经历，建议会更有针对性；如果暂时没有，请简单描述你的背景"
    primary_skill: profile-builder
    secondary_skills:
      - source-quality-auditor
    confidence_gate: "user_profile 存在 或 resume_text 字符数 >= 50"
    fallback: "背景信息不足，方向建议为通用框架 (confidence: low)"

  - name: interview_prep
    label: "面试准备"
    trigger_examples:
      - "帮我准备面试"
      - "面试可能会问什么"
      - "这家公司的面试怎么准备"
      - "技术面一般考什么"
      - "行为面试题怎么答"
      - "我明天有面试，怎么准备"
    required_inputs: []
    optional_inputs:
      - jd_text
      - resume_text
      - user_profile
    missing_input_questions:
      jd_text: "如果能提供 JD，我可以针对这个岗位的具体要求设计面试题"
    primary_skill: interview-intelligence
    secondary_skills:
      - profile-builder
      - jd-analyzer
      - mock-interviewer
      - question-bank-builder
      - behavioral-story-builder
      - company-interview-playbook
    confidence_gate: "jd_text 字符数 >= 50 或 user_profile 存在"
    fallback: "没有具体 JD，只能提供通用面试准备建议 (confidence: low)"

  - name: interview_debrief
    label: "面试复盘"
    trigger_examples:
      - "刚面完，帮我复盘一下"
      - "面试表现如何"
      - "我感觉这轮面试没答好，怎么看"
      - "面试官问了 xxx，我回答了 xxx，这样答对吗"
      - "这轮面试能过吗"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - jd_text
    missing_input_questions:
      user_message: "请描述面试过程：问了什么问题、你怎么回答的，这样我才能做有效复盘"
    primary_skill: interview-debrief
    secondary_skills:
      - profile-builder
    confidence_gate: "user_message 字符数 >= 50"
    fallback: "描述太简短，只能给出一般性反馈 (confidence: low)"

  - name: offer_evaluation
    label: "offer 评估"
    trigger_examples:
      - "这个 offer 值得接吗"
      - "帮我分析一下这个 offer"
      - "两个 offer 怎么选"
      - "这个薪资合理吗"
      - "offer 里的期权/股票值钱吗"
      - "入职时间可以谈吗"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - user_profile
    missing_input_questions:
      user_message: "请提供 offer 的具体内容（薪资结构、公司名、岗位、福利等），这样我才能做全面评估"
    primary_skill: jd-analyzer
    secondary_skills:
      - source-quality-auditor
      - profile-builder
      - offer-comparator
      - company-risk-auditor
      - market-radar
    confidence_gate: "user_message 字符数 >= 30"
    fallback: "offer 信息不足，只能给出框架性评估 (confidence: low)"

  - name: company_check
    label: "公司背景调查"
    trigger_examples:
      - "帮我查一下这家公司"
      - "这个公司靠谱吗"
      - "这家公司发展前景怎么样"
      - "这个公司是外包吗"
      - "这家公司的口碑怎么样"
      - "这个公司值得去吗"
    required_inputs:
      - user_message
    missing_input_questions:
      user_message: "请告诉我公司名称（最好包括具体部门或业务方向），这样我才能给出有针对性的分析"
    primary_skill: source-quality-auditor
    secondary_skills: []
    confidence_gate: "user_message 包含公司名称"
    fallback: "未提供公司名，只能给出通用评估框架 (confidence: low)"

  - name: salary_check
    label: "薪资合理性判断"
    trigger_examples:
      - "这个薪资范围正常吗"
      - "我现在的薪资在市场上什么水平"
      - "这个岗位市场薪资是多少"
      - "给的薪资低了吗"
      - "我该要多少薪资"
      - "年薪 30 万在北京这个岗位算高还是低"
    required_inputs:
      - user_message
    optional_inputs:
      - user_profile
      - jd_text
    missing_input_questions:
      user_message: "请提供岗位名称、城市和你的经验年限，薪资判断需要这些基本参数"
    primary_skill: salary-radar
    secondary_skills:
      - source-quality-auditor
      - market-radar
    confidence_gate: "user_message 包含岗位+城市信息 或 jd_text 字符数 >= 30"
    fallback: "岗位/城市信息不足，薪资判断可信度较低 (confidence: low)"

  - name: find_interview_experience
    label: "寻找面经"
    trigger_examples:
      - "有没有这家公司的面经"
      - "这个岗位的面试流程是什么"
      - "字节跳动产品经理面试怎么样"
      - "有没有类似职位的面试真题"
      - "这家公司几轮面试"
    required_inputs:
      - user_message
    missing_input_questions:
      user_message: "请提供公司名称和岗位，这样我才能查找相关面经信息"
    primary_skill: source-quality-auditor
    secondary_skills: []
    confidence_gate: "user_message 包含公司名称"
    fallback: "未提供公司和岗位信息，只能给出通用面试资源 (confidence: low)"

  - name: write_message
    label: "撰写求职沟通消息"
    trigger_examples:
      - "帮我写一封自荐信"
      - "怎么给 HR 发消息"
      - "帮我写一下 LinkedIn 上的联系消息"
      - "内推申请怎么写"
      - "怎么跟猎头沟通"
      - "感谢信怎么写"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - jd_text
      - user_profile
    missing_input_questions:
      user_message: "请说明消息类型（自荐信/感谢信/内推申请等）以及发给谁，这样我才能写出合适的内容"
    primary_skill: profile-builder
    secondary_skills:
      - jd-analyzer
    confidence_gate: "user_message 字符数 >= 20"
    fallback: "信息不足，只能提供消息模板框架 (confidence: low)"

  - name: daily_planning
    label: "求职日程规划"
    trigger_examples:
      - "帮我规划一下求职计划"
      - "我这周应该做什么"
      - "求职时间管理怎么做"
      - "我同时有 5 个流程，怎么安排"
      - "帮我做一个投递计划"
      - "求职阶段怎么分配时间"
    required_inputs: []
    optional_inputs:
      - user_profile
      - user_message
    missing_input_questions:
      user_message: "请告诉我你目前的求职状态（在投几个岗位、哪些在面试阶段、目标时间线），这样规划会更实用"
    primary_skill: profile-builder
    secondary_skills: []
    confidence_gate: "user_message 字符数 >= 20 或 user_profile 存在"
    fallback: "背景不明，只能给出通用求职时间管理框架 (confidence: low)"

  # ── Pack A: 求职流程管理 ──────────────────────────────────────────

  - name: evaluate_opportunity
    label: "评估职位机会"
    trigger_examples:
      - "这个机会值得花时间吗"
      - "帮我判断这个职位适不适合我"
      - "这个机会有没有发展空间"
      - "这个岗位和我的背景匹配吗"
    required_inputs:
      - jd_text
    optional_inputs:
      - resume_text
      - user_profile
    missing_input_questions:
      jd_text: "请粘贴职位描述，我需要了解这个机会的具体要求和背景才能做出判断"
    primary_skill: opportunity-intelligence
    secondary_skills:
      - jd-analyzer
      - match-diagnosis
      - company-risk-auditor
    confidence_gate: "jd_text 字符数 >= 50"
    fallback: "职位信息不足，只能给出框架性机会评估 (confidence: low)"

  - name: plan_application_strategy
    label: "制定投递策略"
    trigger_examples:
      - "帮我制定投递策略"
      - "我应该投哪些公司"
      - "怎么规划我的求职攻势"
      - "投递顺序怎么安排比较好"
      - "哪些公司应该先投，哪些保底"
    required_inputs: []
    optional_inputs:
      - resume_text
      - user_profile
      - user_message
    missing_input_questions:
      user_message: "请告诉我你的目标岗位、城市偏好和目前掌握的机会列表，这样我才能制定有针对性的投递策略"
    primary_skill: application-strategist
    secondary_skills:
      - profile-builder
      - opportunity-intelligence
      - application-tracker
    confidence_gate: "user_message 字符数 >= 30 或 user_profile 存在"
    fallback: "背景信息不足，只能给出通用投递策略框架 (confidence: low)"

  - name: track_applications
    label: "追踪投递进度"
    trigger_examples:
      - "帮我记录这次投递"
      - "我目前有哪些在进行中的流程"
      - "帮我整理一下求职进度"
      - "这个职位我投了多久了"
      - "哪些公司还没有回音"
    required_inputs:
      - user_message
    optional_inputs:
      - user_profile
    missing_input_questions:
      user_message: "请描述你要追踪的投递信息（公司名、岗位、当前状态），这样我才能帮你更新进度记录"
    primary_skill: application-tracker
    secondary_skills:
      - application-strategist
    confidence_gate: "user_message 字符数 >= 20"
    fallback: "投递信息不完整，只能生成空白追踪框架 (confidence: low)"

  - name: plan_today
    label: "规划今日求职任务"
    trigger_examples:
      - "今天我该做什么"
      - "帮我列一个今天的求职清单"
      - "今天重点搞哪几件事"
      - "给我一个今天的行动计划"
    required_inputs: []
    optional_inputs:
      - user_profile
      - user_message
    missing_input_questions:
      user_message: "请告诉我你目前的求职进展（有几个流程在跑、最近在忙什么），我才能给你安排合理的今日任务"
    primary_skill: daily-plan-generator
    secondary_skills:
      - application-tracker
    confidence_gate: "user_message 字符数 >= 20 或 user_profile 存在"
    fallback: "没有足够的求职状态信息，只能生成通用每日任务模板 (confidence: low)"

  - name: write_networking_message
    label: "撰写人脉开拓消息"
    trigger_examples:
      - "帮我写一条领英加好友消息"
      - "怎么开口向陌生人要内推"
      - "帮我写一条拓展人脉的消息"
      - "怎么联系行业前辈比较好"
      - "冷联系消息怎么写"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - user_profile
    missing_input_questions:
      user_message: "请说明联系对象的背景（行业/职位）以及你的目的（求内推/求建议/学习经验），这样才能写出自然不唐突的消息"
    primary_skill: networking-message-writer
    secondary_skills:
      - profile-builder
    confidence_gate: "user_message 字符数 >= 30"
    fallback: "背景信息不足，只能提供通用人脉消息模板 (confidence: low)"

  - name: find_referral_path
    label: "寻找内推路径"
    trigger_examples:
      - "帮我找这家公司的内推渠道"
      - "怎么找到目标公司的在职员工"
      - "我想走内推，怎么操作"
      - "有没有人可以帮我内推字节"
      - "内推比直投成功率高多少"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - user_profile
    missing_input_questions:
      user_message: "请告诉我目标公司和岗位，以及你目前已知的人脉资源（如果有），这样我才能帮你规划最优的内推路径"
    primary_skill: referral-strategy
    secondary_skills:
      - networking-message-writer
      - application-strategist
    confidence_gate: "user_message 包含公司名称"
    fallback: "没有目标公司信息，只能提供通用内推寻路方法 (confidence: low)"

  - name: write_follow_up
    label: "撰写跟进消息"
    trigger_examples:
      - "帮我写一封面试后的感谢信"
      - "投完简历没动静，要不要催一下"
      - "面试结束后怎么跟进"
      - "帮我写一条给 HR 的跟进消息"
      - "等了两周了还没结果，怎么问"
    required_inputs:
      - user_message
    optional_inputs:
      - resume_text
      - jd_text
    missing_input_questions:
      user_message: "请说明跟进的场景（面试后感谢/催进度/询问结果等）以及距离上次沟通多久了，这样我才能帮你写得合适"
    primary_skill: follow-up-message-writer
    secondary_skills:
      - profile-builder
    confidence_gate: "user_message 字符数 >= 20"
    fallback: "场景不明确，只能提供通用跟进消息模板 (confidence: low)"

  # ── Pack B: 面试准备深度工具 ─────────────────────────────────────

  - name: mock_interview
    label: "模拟面试练习"
    trigger_examples:
      - "帮我模拟一下面试"
      - "我要练习面试，来考我吧"
      - "模拟一轮行为面试"
      - "假装你是面试官"
      - "给我出几道面试题让我回答"
    required_inputs: []
    optional_inputs:
      - jd_text
      - resume_text
      - user_profile
    missing_input_questions:
      jd_text: "如果能提供 JD，我可以模拟这个岗位的真实面试风格；否则我会进行通用模拟"
    primary_skill: mock-interviewer
    secondary_skills:
      - question-bank-builder
      - behavioral-story-builder
      - company-interview-playbook
    confidence_gate: "jd_text 字符数 >= 30 或 user_profile 存在"
    fallback: "没有具体岗位信息，进行通用模拟面试 (confidence: medium)"

  - name: build_question_bank
    label: "构建面试题库"
    trigger_examples:
      - "帮我整理这个岗位的常见面试题"
      - "给我一份面试题清单"
      - "这个公司会考什么题目"
      - "帮我归类整理面试题"
      - "产品经理面试高频题有哪些"
    required_inputs: []
    optional_inputs:
      - jd_text
      - user_message
    missing_input_questions:
      user_message: "请告诉我目标岗位（如产品经理、前端工程师）和公司类型（大厂/创业/外企），这样我才能生成针对性题库"
    primary_skill: question-bank-builder
    secondary_skills:
      - company-interview-playbook
      - xhs-interview-miner
      - nowcoder-tech-miner
    confidence_gate: "user_message 字符数 >= 20 或 jd_text 字符数 >= 30"
    fallback: "岗位信息不足，只能生成通用面试题库 (confidence: low)"

  - name: get_company_playbook
    label: "获取目标公司面试攻略"
    trigger_examples:
      - "字节的面试流程是怎样的"
      - "腾讯产品经理面试有什么特点"
      - "这家公司的面试风格是什么"
      - "阿里面试会看重什么"
      - "美团的面试和别家有什么不一样"
    required_inputs:
      - user_message
    optional_inputs:
      - jd_text
    missing_input_questions:
      user_message: "请告诉我目标公司和岗位，这样我才能给出有针对性的面试攻略"
    primary_skill: company-interview-playbook
    secondary_skills:
      - xhs-interview-miner
      - nowcoder-tech-miner
      - source-quality-auditor
    confidence_gate: "user_message 包含公司名称"
    fallback: "未提供公司名称，只能给出通用大厂面试规律 (confidence: low)"

  - name: build_stories
    label: "构建行为面试故事库"
    trigger_examples:
      - "帮我准备 STAR 故事"
      - "行为面试怎么答"
      - "帮我把经历包装成面试故事"
      - "用 STAR 法则帮我整理经历"
      - "我的经历怎么讲才有感染力"
    required_inputs:
      - resume_text
    optional_inputs:
      - jd_text
      - user_profile
    missing_input_questions:
      resume_text: "请提供你的简历或主要工作经历，我需要了解你做过什么才能帮你提炼出有说服力的 STAR 故事"
    primary_skill: behavioral-story-builder
    secondary_skills:
      - profile-builder
      - mock-interviewer
    confidence_gate: "resume_text 字符数 >= 100"
    fallback: "没有经历信息，无法生成有针对性的行为故事 (confidence: low)"

  - name: prepare_technical
    label: "准备技术面试"
    trigger_examples:
      - "帮我准备技术面"
      - "后端面试要考什么"
      - "算法题怎么准备"
      - "技术面的知识点怎么复习"
      - "系统设计题怎么答"
    required_inputs: []
    optional_inputs:
      - jd_text
      - resume_text
      - user_message
    missing_input_questions:
