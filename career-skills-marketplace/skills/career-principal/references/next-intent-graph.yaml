description: >
  跨意图续接图：每个意图完成后，定义可顺势提议的下一意图（on_complete 续接候选）。
  解 G4「链路不通」——把 40 个意图从孤立路由节点连成连贯求职旅程。
  意图名与 required_inputs 与 references/intent-router.yaml 严格一致；
  与 orchestration-rules.md §12「续接层」配套；承载字段为 output_schema 的 suggested_next。
version: "1.0.0"

# ════════════════════════════════════════════════════════════════════
# 铁律（IRON RULES）—— 任何续接执行前必须遵守
# ════════════════════════════════════════════════════════════════════
iron_rules:
  - id: propose_then_confirm
    title: "续接 = 提议 + 用户确认才执行，默认不自动连跳"
    detail: >
      on_complete 候选只用于「提议」，写进本意图产出的 suggested_next 字段，
      由用户点头才真正调度下一意图。代表绝不自动连跳整条链（防失控长链 / 防越权）。
      priority 仅表达「建议强度」：recommended=情境强相关、应主动点出；
      optional=锦上添花、用户问起或顺带提一句即可。两者都不等于自动执行。
  - id: session_input_reuse
    title: "会话级输入复用：已得的入参续接时直接复用，跳过该字段追问"
    detail: >
      本会话已经拿到的 resume_text / jd_text / user_profile / target_company /
      target_profession 及上一意图的结构化产出（如 diagnosis.interviewHooks、
      match 的 gap），续接到下一意图时直接喂入、不再重复索要（防「失忆」式重复追问）。
      handoff_payload 列出的就是「本意图产出里可直接喂给下一意图的就绪入参键」——
      凡 ready_inputs 已覆盖的 required_inputs，跳过 intent-router 的 missing_input_questions。
      仅当下一意图的 required_inputs 仍有缺口（既不在会话上下文、也不在 handoff_payload）时才追问缺口字段。
  - id: semantics_distinction
    title: "区分 secondary_skills 与 suggested_next"
    detail: >
      secondary_skills（intent-router）= 本次同一调度内的辅助 worker，一锅端、立即执行；
      suggested_next（本图）= 本意图完成后顺势提议的下一个独立意图，分步、条件触发、需确认。

# ════════════════════════════════════════════════════════════════════
# handoff_payload 字段约定
#   每个 on_complete 候选含：
#     next_intent      : 下一意图名（必须存在于 intent-router.yaml）
#     condition        : 触发条件（自然语言判定，如「有简历」「强匹配」「有 gap」「给了目标公司」）
#     handoff_payload  : 从本意图产出 / 会话上下文中可直接喂给下一意图的就绪入参键列表
#                        （这些键满足下一意图的 required/optional 输入，复用时跳过追问）
#     priority         : recommended | optional
#     reason           : 一句话说明「为什么这条续接对用户有价值」（写进 suggested_next.reason）
# ════════════════════════════════════════════════════════════════════

intents:

  # ── 核心诊断链：JD → 匹配 → 改简历 / 策略 / 补技能 / 面试 ──────────────

  analyze_jd:
    on_complete:
      - next_intent: match_diagnosis
        condition: "会话中已有 resume_text（用户给过简历）"
        handoff_payload: [resume_text, jd_text]
        priority: recommended
        reason: "JD 已拆解，顺势看你和这个岗位的真实匹配度，比单看要求更有决策价值"
      - next_intent: tailor_resume
        condition: "已有 resume_text 且用户想投这个岗位"
        handoff_payload: [resume_text, jd_text]
        priority: optional
        reason: "JD 关键词已提取，可直接据此优化简历的针对性"
      - next_intent: evaluate_opportunity
        condition: "用户在纠结这个机会值不值得花时间"
        handoff_payload: [jd_text, resume_text]
        priority: optional
        reason: "JD 之外，把机会成本 / 发展空间一起评，避免只看岗位本身"
      - next_intent: salary_check
        condition: "JD 含薪资区间，或用户关心给的钱合不合理"
        handoff_payload: [jd_text]
        priority: optional
        reason: "JD 里的薪资可对照市场行情快速验证是否合理"

  match_diagnosis:
    on_complete:
      - next_intent: tailor_resume
        condition: "强匹配（匹配度高 / 多数硬性要求达标）"
        handoff_payload: [resume_text, jd_text]
        priority: recommended
        reason: "匹配度够，值得把简历针对这个 JD 打磨到位、放大优势项"
      - next_intent: plan_application_strategy
        condition: "强匹配，值得正经投"
        handoff_payload: [resume_text, user_profile, jd_text]
        priority: recommended
        reason: "既然匹配，顺势把这个岗位排进冲稳保梯度、定投递节奏"
      - next_intent: identify_skill_gaps
        condition: "诊断出 gap（存在未达标的硬性要求 / 能力短板）"
        handoff_payload: [resume_text, jd_text, user_profile]
        priority: recommended
        reason: "把诊断暴露的差距转成可补的技能清单，针对性提升"
      - next_intent: interview_prep
        condition: "任意（无论强弱匹配，决定投递即可备面）"
        handoff_payload: [jd_text, resume_text, user_profile]
        priority: optional
        reason: "确定要投就可以开始备面，越早越从容"

  tailor_resume:
    on_complete:
      - next_intent: mock_interview
        condition: "简历已改好，想检验经历经不经得起追问"
        handoff_payload: [resume_text, jd_text, user_profile]
        priority: recommended
        reason: "改写后的简历每条都可能被面试官追问，先模拟一轮压力测试"
      - next_intent: build_stories
        condition: "简历里有可挖掘的项目 / 经历"
        handoff_payload: [resume_text, jd_text, user_profile]
        priority: recommended
        reason: "把简历经历提炼成 STAR 故事，行为面随时调用、讲得有感染力"

  # ── 校招诊断链：interviewHooks 当弹药 / gap 补技能 / 改写复核 / 目标公司 ──

  campus_diagnosis:
    on_complete:
      - next_intent: mock_interview
        condition: "诊断产出了 interviewHooks（面试追问预演）"
        handoff_payload: [resume_text, target_profession, interviewHooks, jd_text]
        priority: recommended
        reason: "诊断已点出最可能被追问的薄弱点，直接拿 interviewHooks 当弹药模拟面试"
      - next_intent: build_stories
        condition: "诊断产出了 interviewHooks，且简历有可讲的经历"
        handoff_payload: [resume_text, interviewHooks, target_profession]
        priority: recommended
        reason: "把 interviewHooks 指向的命中点打磨成经得起追问的 STAR 故事"
      - next_intent: identify_skill_gaps
        condition: "诊断维度暴露了 gap（dimensions[].gap 非空）"
        handoff_payload: [resume_text, target_profession, jd_text]
        priority: recommended
        reason: "把各维度的 gap 转成可执行的技能补齐清单"
      - next_intent: build_learning_roadmap
        condition: "存在 gap 且距投递还有时间窗"
        handoff_payload: [resume_text, target_profession, user_profile]
        priority: optional
        reason: "gap 不只要识别，给一份带时间线的学习路线才落得了地"
      - next_intent: tailor_resume
        condition: "诊断产出了 rewrite_suggestions，用户想据此改简历"
        handoff_payload: [resume_text, rewrite_suggestions, jd_text]
        priority: recommended
        reason: "校招改写建议已成型，可走 tailor_resume 复核并落到正式版简历"
      - next_intent: company_check
        condition: "用户给了目标公司（target_company 已知）"
        handoff_payload: [target_company]
        priority: optional
        reason: "既然有目标公司，先把它的背景 / 靠谱度查清楚再投"
      - next_intent: get_company_playbook
        condition: "用户给了目标公司，且想了解其面试风格"
        handoff_payload: [target_company, target_profession]
        priority: optional
        reason: "针对目标公司的面试考点 / 风格预演，比通用备面更贴合"

  # ── offer / 比价链：薪资核 / 公司风险 / 落户城市适配 ──────────────────

  offer_evaluation:
    on_complete:
      - next_intent: salary_check
        condition: "offer 含薪资，想验证是否市场合理 / 有谈薪空间"
        handoff_payload: [user_message, user_profile, jd_text]
        priority: recommended
        reason: "拿 offer 薪资对照市场行情，判断该接、该谈、还是该等"
      - next_intent: audit_company_risk
        condition: "任意（接 offer 前都该排查公司风险）"
        handoff_payload: [user_message]
        priority: recommended
        reason: "入职前把裁员 / 资金链 / 行业前景风险信号过一遍，避免踩坑"
      - next_intent: find_city_industry_fit
        condition: "offer 涉及异地 / 用户关心落户红利"
        handoff_payload: [user_profile, user_message]
        priority: optional
        reason: "offer 所在城市的落户 / 行业氛围 / 生活成本一起看，决策更全面"
      - next_intent: compare_offers
        condition: "用户手上不止一个 offer"
        handoff_payload: [user_message, user_profile]
        priority: optional
        reason: "有多个 offer 就做横向对比，别只孤立评单个"

  compare_offers:
    on_complete:
      - next_intent: salary_check
        condition: "各 offer 薪资差异大，想核对市场水位"
        handoff_payload: [user_message, user_profile]
        priority: recommended
        reason: "把对比中的薪资逐个对照市场行情，看哪个被低估 / 高估"
      - next_intent: audit_company_risk
        condition: "任意（选 offer 前排查各公司风险）"
        handoff_payload: [user_message]
        priority: recommended
        reason: "薪资接近时，公司风险往往是决胜项，逐个排查"
      - next_intent: find_city_industry_fit
        condition: "各 offer 分布在不同城市 / 用户关心落户"
        handoff_payload: [user_profile, user_message]
        priority: optional
        reason: "跨城市 offer 把落户红利 / 行业格局纳入对比，避免只看薪资数字"

  # ── 机会评估 → 投递策略 → 进度追踪（Pack A 流程主轴）─────────────────

  evaluate_opportunity:
    on_complete:
      - next_intent: plan_application_strategy
        condition: "机会值得投（评估为正向）"
        handoff_payload: [jd_text, resume_text, user_profile]
        priority: recommended
        reason: "确认机会值得后，把它排进整体投递策略的冲稳保梯度"
      - next_intent: match_diagnosis
        condition: "已有 resume_text，想先确认自身匹配度再决定投不投"
        handoff_payload: [resume_text, jd_text]
        priority: optional
        reason: "机会评估偏外部，配上匹配度诊断才知道自己有多大胜算"

  plan_application_strategy:
    on_complete:
      - next_intent: track_applications
        condition: "策略已定，进入执行投递阶段"
        handoff_payload: [user_message, user_profile]
        priority: recommended
        reason: "策略落地就要追踪——把投出去的每个流程进度管起来，别漏跟进"
      - next_intent: find_referral_path
        condition: "策略里有目标公司，想提高命中率"
        handoff_payload: [user_message, resume_text, user_profile]
        priority: optional
        reason: "投递前先找内推路径，命中率显著高于裸投"
      - next_intent: plan_today
        condition: "策略偏宏观，用户想要今天的具体行动"
        handoff_payload: [user_profile, user_message]
        priority: optional
        reason: "把投递策略拆成今天能动手的清单，避免计划停在纸上"
