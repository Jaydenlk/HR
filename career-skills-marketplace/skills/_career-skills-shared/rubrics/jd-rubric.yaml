# JD 解析量纲 (JD Parsing Rubric)
# Career Skills Marketplace — jd-parser skill 使用
# 版本: 1.0.0

rubric_version: "1.0.0"
description: "JD（职位描述）结构化解析标准，适配中国主流招聘平台格式"

# ============================================================
# 解析维度
# ============================================================
dimensions:

  explicit_requirements:
    label: "显性要求提取"
    description: "从 JD 中直接标注的硬性要求（学历、工作年限、技术栈、证书等）"
    extraction_rules:
      - "提取所有明确标注为'必须'/'要求'/'需要'的条件"
      - "识别学历要求：本科/硕士/博士及以上，并注意'本科优先'与'本科要求'的区别"
      - "提取工作年限：区分'X年以上'和'X-Y年'"
      - "提取技术栈：编程语言、框架、工具、平台（须区分必须/加分）"
      - "提取证书/资质要求（如 PMP、CPA、驾照）"
      - "提取语言要求（英语四六级、雅思托福分数、流利/基础）"
    output_fields:
      - education_required
      - years_experience_required
      - skills_required
      - certifications_required
      - language_required
    china_platform_notes:
      boss_zhipin:
        - "BOSS直聘 JD 通常简短，技能标签单独展示，需合并正文+标签"
        - "薪资常显示为区间（如'15-25K'），需提取范围"
        - "融资阶段和公司规模在详情页，非 JD 正文"
      lagou:
        - "拉勾 JD 通常分'职位描述'和'任职要求'两块，需分别解析"
        - "技术栈标签在职位标签区，注意提取"
        - "拉勾标注'弹性工作制'等福利，可提取为约束项"
      liepin:
        - "猎聘偏中高端，JD 通常更详细，有完整职责描述"
        - "猎聘常有'向谁汇报'信息，可提取职级定位"
        - "有些猎聘 JD 含薪资范围（Base+期权），注意结构化"

  implicit_requirements:
    label: "隐性要求推断"
    description: "JD 未直接说明但通过上下文可合理推断的要求"
    inference_rules:
      - "从职责描述推断工作强度（'快速迭代'/'双周发版' = 高强度暗示）"
      - "从团队规模推断独立工作要求（'小团队' = 需要自驱，'大厂背景优先' = 规范化流程经验）"
      - "从汇报关系推断职级（'直接向CTO汇报' = 高级岗位）"
      - "从业务描述推断领域知识（'to B SaaS' = 需理解企业客户决策链）"
      - "从黑话密度推断企业文化（高度黑话 = 强调对齐文化）"
      - "从福利描述反推工作强度（'保障双休'/'大小周' = 工时信号）"
    confidence_note: "隐性要求推断 confidence 上限为 medium，必须标注为推断"
    china_specific:
      - "'有大厂背景优先'暗示岗位对规范化流程有要求"
      - "'自驱力强'通常意味着管理支持不足"
      - "'工作地点：北京/上海' 但公司总部在其他城市，需注意出差频率"
      - "'发展空间大'可能是早期阶段或管理层级不清晰"

  risk_signals:
    label: "风险信号识别"
    description: "JD 中反映潜在求职风险的语言特征"
    risk_categories:
      high_overtime_risk:
        signals:
          - "'狼性文化'/'拼搏精神'/'结果导向'"
          - "'大小周'/'弹性工作（晚上弹性）'"
          - "'工作时间：9:00-21:00（弹性）'"
          - "'热爱加班'/'愿意与公司共同成长'"
        action: "在 risks 中标注为高加班风险，建议候选人提前了解真实工时"

      vague_compensation:
        signals:
          - "薪资'面议'但未给区间"
          - "'基础薪资+绩效'但不说明绩效比例"
          - "'期权/股票'但不说明行权条件"
        action: "标注薪资透明度风险，建议候选人在面试时直接确认"

      high_turnover_signal:
        signals:
          - "同一岗位 JD 长期挂着（超 60 天）"
          - "多个相同职级岗位同时招聘"
          - "要求经验宽泛（'3-10年均可'）"
        action: "标注可能高流失率信号，建议候选人了解离职原因"

      startup_risk:
        signals:
          - "'A轮及以下'融资阶段"
          - "'团队规模：10-50人'"
          - "'与创始人并肩作战'"
          - "JD 描述夸大、宏大愿景但具体职责模糊"
        action: "标注初创风险，包括稳定性和薪资兑现风险"

      scope_creep:
        signals:
          - "职责列表超过 10 条且跨多个专业领域"
          - "'及其他临时交代的工作'"
          - "'全栈'但同时要求前后端+运维+数据"
        action: "标注职责边界模糊风险，可能存在职能混用"

    china_specific:
      - "国内 JD 的'执行力强'通常意味着决策权上移，执行层自主度低"
      - "'快速成长'既可能是真实机会，也可能是掩盖低薪的话术"
      - "'股权/期权'在非上市公司流动性极低，需核实行权条件"

  format_handling:
    label: "格式处理能力"
    description: "正确处理不同招聘平台 JD 的格式差异"
    rules:
      - "去除平台无关信息（公司介绍、福利列表、联系方式）"
      - "合并分散在不同板块的同类信息（标签+正文技能要求）"
      - "处理 markdown 格式（列表、加粗）"
      - "处理纯文本格式（无换行的段落）"
      - "识别并忽略模板占位符（'[岗位职责]'之类的标题行）"
      - "处理截图来源 JD（OCR 识别误差，常见于小红书/微信分享）"
    normalization:
      - "统一年限格式：'三年' → '3年'，'3年以上' → '>= 3 years'"
      - "统一学历格式：'本科' → 'bachelor'，'研究生' → 'master'"
      - "统一薪资格式：'15-25K' → { min: 15000, max: 25000, unit: 'CNY/month' }"

# ============================================================
# 解析质量评分
# ============================================================
quality_scoring:
  completeness:
    description: "提取到的字段占 JD 实际包含字段的比例"
    target: ">= 0.85"

  accuracy:
    description: "提取结果与 JD 原文意思一致的比例"
    target: ">= 0.95"

  hallucination_check:
    rule: "禁止推断 JD 未提及的硬性要求"
    example_violation: "JD 未提 Python，不能推断'可能需要 Python'"
    confidence_for_inference: "隐性推断必须标注 source_type: ai_inference"

  cannot_parse_rule:
    rule: "JD 内容不足（少于 50 字）或无法解析时，返回 insufficient confidence 并要求用户提供完整 JD"
    rationale: "不完整的 JD 解析结果会误导后续匹配"
