meta:
  name: Offer比较因素体系
  version: "1.0"
  confidence: medium
  source_policy: "基于公开薪酬调研、招聘平台信息及行业经验汇编"
  last_reviewed_at: "2026-05-26"
  limitations:
    - "薪酬数据随市场变化，仅供结构性参考"
    - "具体福利政策以公司实际签订劳动合同为准"
    - "股权估值具有较高不确定性"

factors:
  - id: base_salary
    name: 月base薪资
    description: 每月固定税前基本工资，不含奖金和股权
    unit: "月薪（人民币元）"
    how_to_compare:
      - "优先看月base而非年包，因为年包计算口径各公司不同"
      - "问清楚是否含社保公积金个人部分"
      - "确认试用期是否全额发放"
    china_specific_notes:
      - "部分公司年包 = 月薪 × 12，另一些 = 月薪 × 13 或 14"
      - "大厂常见 16薪、18薪 表述，需折算月base对比"
      - "试用期薪资：互联网公司通常全额，部分传统企业打8折"
    confidence: medium
    source_policy: "基于公开招聘信息及候选人反馈汇编"

  - id: annual_bonus
    name: 年终奖
    description: 年度绩效奖金，通常在次年年初发放
    unit: "月薪倍数"
    how_to_compare:
      - "询问历史兑现情况，而非只看承诺"
      - "了解绩效评定标准和分布比例"
      - "确认发放时间和在职要求"
    typical_range_by_company_type:
      big_tech_internet: "2-6个月，视绩效等级"
      startup: "0-3个月，与公司业绩强挂钩"
      state_owned: "1-3个月，相对稳定"
      foreign: "1-4个月，通常有明确的绩效评级体系"
      consulting: "4-12个月，弹性大"
    performance_link:
      typical_levels: [超预期, 达预期, 待提升]
      bonus_multiplier_example: "超预期1.5x，达预期1.0x，待提升0.5x或不发"
    china_specific_notes:
      - "部分大厂年终奖在春节前发放，跳槽时机影响奖金是否到手"
      - "应届生通常第一年没有年终奖或按入职月份折算"
    confidence: medium
    source_policy: "基于公开薪酬调研及招聘信息汇编"

  - id: stock_equity
    name: 股权/期权
    description: 公司授予的股权激励，包含RSU（限制性股票）和期权两种主要形式
    unit: "美元或人民币市值"
    types:
      rsu:
        name: RSU（限制性股票单位）
        description: 上市公司常用，按归属计划分批兑现
        vesting_schedule_examples:
          - "4年归属，每年25%"
          - "4年归属，第1年25%，之后每季度6.25%"
          - "1年cliff，之后每月归属"
        valuation_notes: "参考授予时股价，实际价值随股价波动"
      stock_option:
        name: 期权
        description: 非上市公司常用，需公司上市或被收购才能变现
        key_questions:
          - "行权价格是多少？"
          - "最近一轮估值是多少？"
          - "有没有二级市场或回购计划？"
        risk_note: "期权存在归零风险，未上市公司流动性差"
    how_to_compare:
      - "上市公司RSU可按当前股价折算年均价值"
      - "未上市公司期权保守估值，高度关注行权价与估值比"
      - "对比total compensation = base + bonus + equity年均值"
    china_specific_notes:
      - "A股上市公司限制性股票有锁定期，一般1-3年"
      - "部分中概股RSU需考虑美股波动和外汇兑换"
      - "早期初创公司期权兑现周期可能超过5年"
    confidence: low
    source_policy: "股权估值高度依赖公司具体情况，以下为结构性指引"

  - id: social_insurance_fund
    name: 五险一金
    description: 法定社会保险和住房公积金，包括养老、医疗、失业、工伤、生育险及公积金
    how_to_compare:
      - "关注缴纳基数：按实际工资还是最低基数"
      - "公积金缴纳比例：5%-12%不等，高比例等于隐形加薪"
      - "部分外企按实际工资全额缴纳，价值可观"
    components:
      养老保险: { employee_rate: "8%", employer_rate: "约16%" }
      医疗保险: { employee_rate: "约2%", employer_rate: "约10%" }
      失业保险: { employee_rate: "约0.5%", employer_rate: "约0.5%" }
      工伤保险: { employee_rate: "0%", employer_rate: "视行业" }
      生育保险: { employee_rate: "0%", employer_rate: "约0.8%" }
      住房公积金: { employee_rate: "5%-12%", employer_rate: "与员工同比例" }
    china_specific_notes:
      - "各城市缴纳比例有所不同，以当地政策为准"
      - "部分公司以最低基数缴纳以降低成本，员工实际受益减少"
      - "公积金可用于购房贷款，在一线城市有较高实用价值"
    confidence: medium
    source_policy: "基于国家法规及各地政策文件汇编"

  - id: supplemental_benefits
    name: 补充福利
    description: 公司提供的超出法定要求的额外福利
    components:
      supplemental_medical:
        name: 补充医疗保险
        description: 覆盖法定医保之外的医疗费用
        value_note: "互联网大厂通常提供，年保额可达20-50万"
      meal_allowance:
        name: 餐补
        description: 工作日餐费补贴
        typical_range: "15-30元/天，部分公司提供免费餐厅"
      housing_allowance:
        name: 房补
        description: 住房补贴，多见于国企和部分外企
        typical_range: "500-3000元/月，视级别和城市"
      transport_allowance:
        name: 交通补贴
        description: 上下班交通费用补贴
        typical_range: "200-1000元/月，或报销实际费用"
      health_checkup:
        name: 年度体检
        description: 公司组织的年度健康检查
        value_note: "高级别员工通常有更全面的体检套餐"
      gym_fitness:
        name: 健身补贴
        description: 健身房会员或运动相关补贴
        typical_range: "部分互联网公司提供，100-500元/月"
    how_to_compare:
      - "将可量化福利折算成月均金额进行对比"
      - "关注补充医疗保险的覆盖范围和报销比例"
    confidence: medium
    source_policy: "基于公开招聘信息及企业官方福利说明汇编"

  - id: work_hours
    name: 工作时长与强度
    description: 实际工作时间安排，影响生活质量和隐性成本
    how_to_compare:
      - "询问团队实际工作时间，而非制度规定"
      - "了解是否有弹性工作或远程工作政策"
      - "确认加班是否有调休或加班费"
    estimate_by_company_type:
      internet_big_tech:
        typical: "早10-晚22（1022工作制），部分团队更长"
        overtime_compensation: "通常无加班费，文化默认加班"
      internet_mid_tier:
        typical: "早10-晚20，视项目周期波动"
        overtime_compensation: "部分有调休机制"
      startup:
        typical: "高度不确定，融资期可能996"
        overtime_compensation: "通常以期权或期权补偿"
      foreign:
        typical: "相对规律，早9-晚6"
        overtime_compensation: "通常有明确加班补偿机制"
      state_owned:
        typical: "朝九晚五，较为规律"
        overtime_compensation: "通常有调休，加班较少"
    china_specific_notes:
      - "996、007等表述在互联网行业有特定含义"
      - "法定加班应支付150%/200%/300%工资，实际执行存在差异"
      - "调休在大厂中更为普遍，但时间安排灵活性因团队而异"
    confidence: medium
    source_policy: "基于公开调研和行业观察，具体情况因团队而异"

  - id: special_benefits
    name: 特殊一次性福利
    description: 入职时或特定时期提供的一次性补贴
    components:
      signing_bonus:
        name: 签字费
        description: 入职时一次性发放的奖励，通常有服务期约定
        typical_conditions: "服务满1-2年，否则需按比例返还"
        typical_range_by_company_type:
          big_tech: "1-6个月月薪，竞争激烈时可更高"
          foreign: "1-3个月月薪"
          startup: "少见，或以期权替代"
        note: "离职时可能需要返还，注意合同条款"
      relocation_allowance:
        name: 安家费/搬迁补贴
        description: 跨城市入职时提供的搬迁补助
        typical_range: "5000-30000元，视距离和级别"
      hukou_quota:
        name: 户口指标
        description: 北京、上海等限制性城市的落户名额
        value_note: "在一线城市具有极高价值，难以直接货币化"
        availability: "主要见于部分国企、外企和部分大厂应届生名额"
        china_specific_notes:
          - "北京上海户口极为稀缺，是很多候选人的重要考量"
          - "落户名额通常有服务年限要求（3-5年）"
    how_to_compare:
      - "签字费需考虑服务期约束的机会成本"
      - "户口价值因个人情况差异极大，需结合长期规划判断"
    confidence: medium
    source_policy: "基于公开招聘信息及候选人经验汇编"

  - id: career_development
    name: 职业发展资源
    description: 影响长期职业价值的学习和发展机会
    how_to_compare:
      - "评估岗位的外部市场认可度和品牌背书价值"
      - "了解晋升周期和晋升通道"
      - "确认是否有导师制度或技术成长体系"
    components:
      brand_value:
        name: 公司品牌价值
        description: 简历上此公司经历的市场认可度
        note: "头部大厂背书对未来求职有显著正向影响"
      promotion_cycle:
        name: 晋升周期
        description: 从当前级别晋升到下一级别的典型时间
        typical_by_company:
          internet_big: "通常1-2年，竞争激烈"
          foreign: "通常2-3年，较为透明"
          state_owned: "通常3-5年，资历权重大"
      learning_resources:
        name: 学习资源
        description: 培训预算、内部课程、会议参与机会等
    confidence: medium
    source_policy: "基于公开信息汇编，具体情况以入职后实际体验为准"

  - id: housing_fund_rate
    name: 公积金缴纳比例
    description: 企业为员工缴纳的住房公积金比例，法定范围为5%-12%，高比例等同于隐形加薪
    unit: "占月薪百分比（%）"
    how_to_compare:
      - "核实实际缴纳比例（5%与12%之间年差近一个月薪资）"
      - "确认缴纳基数是否按实际工资全额计算，还是按最低基数"
      - "高缴存比例在一线城市房贷场景下价值显著"
    range_by_company_type:
      internet_big: "通常8%-12%，头部企业多选最高比例"
      startup: "通常5%-8%，降低成本"
      state_owned: "通常10%-12%，待遇稳定"
      foreign: "通常10%-12%，合规意识强"
    calculation_example: "月薪30000元，公积金比例差7%（5% vs 12%），每月个人+单位差额达4200元，全年约5万元"
    china_specific_notes:
      - "各城市缴纳上限不同，超出上限部分仍按上限计入公积金账户"
      - "部分公司以当地最低基数缴纳以节省成本，名义上合规但员工受益极少"
      - "公积金账户资金可提取用于购房还贷，在北京、上海、深圳具有较高实用价值"
    confidence: high
    source_policy: "依据《住房公积金管理条例》及各地政府发布的缴存比例规定"

  - id: supplemental_housing_fund
    name: 补充公积金
    description: 部分企业（尤其是上海地区）在法定公积金之外额外缴纳的住房公积金，属于企业自愿福利，税收处理有别于法定公积金
    unit: "月薪百分比或固定金额（元/月）"
    how_to_compare:
      - "确认是否有补充公积金及比例，这是超出法定的额外福利"
      - "了解补充公积金是否计入应税收入（各地政策不同）"
      - "折算年均价值后纳入total compensation比较"
    availability:
      region: "主要见于上海，部分外资企业在其他城市也有设立"
      company_type: "外资企业、部分国企、少数大型互联网公司"
    china_specific_notes:
      - "上海补充公积金政策最为完善，最高缴存比例有明确规定"
      - "补充公积金可与法定公积金共同用于购房贷款或提取"
      - "非上海地区的补充公积金政策各异，需向HR确认具体政策"
    confidence: medium
    source_policy: "依据上海市住房公积金管理中心相关规定及各地地方性政策文件"

  - id: enterprise_annuity
    name: 企业年金
    description: 企业在参加基本养老保险基础上，为员工建立的补充养老金计划，主要见于国有企业和部分外资企业，互联网公司极少设立
    unit: "月薪百分比"
    how_to_compare:
      - "询问是否设有企业年金及缴纳比例（通常为月薪4%-8%）"
      - "了解归属规则：部分企业需满一定服务年限才可完全归属"
      - "折算为年均价值后加入total compensation对比"
    availability:
      typical_sectors: ["国有企业", "央企", "外资金融机构", "部分大型外企"]
      rare_in: ["互联网初创", "中小民营企业"]
    china_specific_notes:
      - "企业年金属于递延税收优惠的补充养老金，在退休时一并领取"
      - "选择国企/央企的求职者应将企业年金纳入长期收益计算，价值可观"
      - "互联网公司通常以股权激励替代企业年金"
    confidence: medium
    source_policy: "依据《企业年金试行办法》（人社部令第36号）；具体方案以企业年金计划书为准"

  - id: hukou_quota
    name: 落户指标
    description: 北京、上海等户籍严格管控城市的本地户口申请资格，由企业拥有配额并按需分配给员工，具有极高稀缺价值，难以直接货币化
    unit: "有/无（定性指标）"
    how_to_compare:
      - "确认企业是否拥有所在城市的落户名额及可分配数量"
      - "了解分配规则：是否需要竞争、服务年限要求、优先条件"
      - "结合个人是否需要落户综合评估价值（已有户口则无意义）"
    eligibility_factors:
      - "通常要求应届毕业生身份（非应届生有独立的积分或人才引进通道）"
      - "重点高校（双一流）毕业生通常有更多机会"
      - "部分城市要求一定工作年限后才可申请"
    china_specific_notes:
      - "北京户口极为稀缺，大厂每年落户名额有限，竞争激烈"
      - "上海落户通道相对多元：应届生直接落户、居住证积分、人才引进等"
      - "拥有北京/上海户口对子女教育、购房资格、社保待遇有重大影响"
      - "落户指标通常有服务年限约束（3-5年），提前离职可能影响落户进程"
    confidence: medium
    source_policy: "依据各城市户籍管理办法及人才引进政策；具体指标数量以企业HR确认为准"

  - id: probation_salary_ratio
    name: 试用期薪资比例
    description: 试用期内实际发放薪资与正式薪资的比例，法定最低不低于正式薪资的80%，实际执行因企业性质差异显著
    unit: "百分比（%）"
    how_to_compare:
      - "确认试用期薪资是否为全额（100%）或打折（80%-90%）"
      - "了解试用期时长（法定上限：工作年限1年以内1个月，1-3年2个月，3年以上6个月）"
      - "折算试用期损失金额：差额×试用期月数"
    typical_by_company_type:
      internet_big: "通常全额（100%），部分公司不设试用期或1个月"
      startup: "80%-100%不等，需明确确认"
      foreign: "通常90%-100%，有明确制度"
      state_owned: "通常80%-90%，试用期较长（3-6个月）"
    china_specific_notes:
      - "《劳动合同法》规定试用期薪资不得低于正式薪资80%，低于此比例违法"
      - "互联网大厂通常以全额发放为卖点，试用期打折现象在传统企业更普遍"
      - "谈薪时应明确约定试用期薪资，口头承诺无法律效力"
    confidence: high
    source_policy: "依据《劳动合同法》第20条；具体比例以劳动合同书面条款为准"

  - id: non_compete_compensation
    name: 竞业限制补偿
    description: 签署竞业协议的员工在协议执行期间每月应获得的经济补偿，法律要求不低于离职前月薪的30%，各地司法实践标准不同，部分地区要求50%以上
    unit: "离职前月薪百分比（%）"
    how_to_compare:
      - "确认竞业协议是否实际被执行（书面通知为准，无通知则不受约束）"
      - "了解补偿比例和支付方式（按月支付还是一次性支付）"
      - "评估竞业范围的合理性：范围越广风险越高"
    legal_baseline:
      national_minimum: "不低于离职前12个月月均薪资的30%"
      shanghai_standard: "不低于离职前12个月月均薪资的50%"
      beijing_standard: "通常参照月薪25%-50%，以实际判例为准"
    china_specific_notes:
      - "公司未在解除劳动合同后按月支付补偿的，竞业限制条款自动失效"
      - "竞业限制期限最长不超过2年"
      - "互联网大厂普遍使用竞业协议，高级别岗位尤需关注范围和补偿"
      - "收到竞业执行通知前可咨询劳动律师评估是否有据可争"
    confidence: medium
    source_policy: "依据《劳动合同法》第23-24条及各地司法实践判例；具体金额以劳动合同和仲裁结果为准"
