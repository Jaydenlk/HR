# 校招面试题型配比表 (interview-focus)
#
# 用途:供 mock-interviewer / question-bank-builder / interview-intelligence
#       按"目标职业"分配面试题量。每个职业一组四维题型配比
#       {behavioral, case_study, technical, culture_fit}(四者之和=100)+ 一句 note。
#
# 配比含义:
#   behavioral  — 行为面(STAR/经历追问/动机/抗压等过往行为类)
#   case_study  — 案例/情景题(开放设计、商业/产品分析、估算、场景推演)
#   technical   — 硬技术/专业知识(编码、算法、专业原理、工具实操、笔试)
#   culture_fit — 文化/价值观/团队契合(动机、稳定性、价值观匹配、软素质)
#
# 锚点:以 role-taxonomy/roles.yaml 的 30 个 interview_focus 为基准,
#       按 campus-recruitment-rubrics/index.md 的 90 细分职业做行业化调整。
#       键用 profession 中文名(与标尺 index.md 一致),niche 职业用行业常识合理给。
#
# 使用方式:mock-interviewer 取目标职业的配比 × 计划总题数 = 各类型题量;
#          question-bank-builder 按配比从题库抽题;
#          interview-intelligence 据此提示候选人各环节准备重点。

meta:
  total: 90
  sum_invariant: behavioral + case_study + technical + culture_fit = 100
  anchor: role-taxonomy/roles.yaml (30 roles)
  aligned_with: campus-recruitment-rubrics/index.md (90 professions)
  note: 校招语境(应届/0年经验);相比社招更看重潜力与文化契合,technical 略降、culture_fit/behavioral 略升

