$schema: "http://json-schema.org/draft-07/schema#"
title: MatchDiagnosisInput
type: object
required: [user_profile, jd_analysis]

properties:
  user_profile:
    type: object
    description: 用户结构化画像（必须提供）
    properties:
      basic_info:
        type: object
        properties:
          name: { type: string }
          target_role: { type: string, description: 用户期望的目标岗位 }
          years_of_experience: { type: number, minimum: 0 }
          location:
            type: string
            description: 用户当前所在城市
          current_salary_range:
            type: string
            description: 当前薪资范围（用于判断薪资是否匹配）
          work_authorization:
            type: string
            description: 工作授权状态（如：中国公民、需要签证等）
      work_experience:
        type: array
        items:
          type: object
          properties:
            company: { type: string }
            title: { type: string }
            industry: { type: string }
            start_date: { type: string }
            end_date: { type: string }
            description: { type: string }
            achievements:
              type: array
              items: { type: string }
      education:
        type: array
        items:
          type: object
          properties:
            school: { type: string }
            degree:
              type: string
              description: "学历层次：高中/大专/本科/硕士/博士"
            major: { type: string }
            graduation_date: { type: string }
      skills:
        type: object
        properties:
          technical:
            type: array
            items: { type: string }
          soft:
            type: array
            items: { type: string }
          certifications:
            type: array
            items: { type: string }
      constraints:
        type: object
        description: 求职约束条件
        properties:
          preferred_locations:
            type: array
            items: { type: string }
          work_type:
            type: string
            enum: [full_time, part_time, internship, contract, any]
            default: any
          earliest_start_date:
            type: string
          expected_salary_range:
            type: string

  jd_analysis:
    type: object
    description: JD 结构化分析结果（必须提供）
    properties:
      job_title: { type: string }
      company: { type: string }
      industry: { type: string }
      required_skills:
        type: array
        items:
          type: object
          required: [skill, level]
          properties:
            skill: { type: string }
            level:
              type: string
              enum: [required, preferred, nice_to_have]
            years: { type: string }
      responsibilities:
        type: array
        items: { type: string }
      qualifications:
        type: object
        properties:
          education: { type: string }
          experience_years: { type: string }
          must_have:
            type: array
            items: { type: string }
          nice_to_have:
            type: array
            items: { type: string }
      location: { type: string }
      work_type:
        type: string
        enum: [full_time, part_time, internship, contract]
      salary_range: { type: string }
      keywords:
        type: array
        items: { type: string }

  confidence_policy:
    type: object
    required: false
    properties:
      min_confidence_to_score:
        type: string
        enum: [high, medium, low]
        default: low
